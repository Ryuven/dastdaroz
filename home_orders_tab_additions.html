<!-- ── [1] Добавить вкладку "Ожидает оплаты" в order-tabs ───────
     Найди в home.html:
       <div class="order-tabs">
     Добавь новую кнопку ПЕРВОЙ:
-->
<div class="order-tabs">
  <button class="otab" onclick="setOTab('awaiting_payment',this)">💳 Интизори пардохт</button>
  <button class="otab active" onclick="setOTab('all',this)">Ҳама</button>
  <button class="otab" onclick="setOTab('active',this)">Фаъол</button>
  <button class="otab" onclick="setOTab('delivered',this)">Расонида шуд</button>
  <button class="otab" onclick="setOTab('cancelled',this)">Бекор</button>
</div>
<!-- Также в filterOrders() добавить:

       return orders.filter(o => o.status === 'awaiting_payment');
-->


<!-- ── [2] Обновить select оплаты в корзине ──────────────────────
     Найди в home.html:
       <select class="addr-inp" id="cart-pay">
     Замени содержимое:
-->
<select class="addr-inp" id="cart-pay">
  <option value="cash">💵 Нақдӣ ба курьер</option>
  <option value="card">💳 Пардохти онлайн (корти бонкӣ)</option>
</select>
<!-- При выборе "card" → doCheckout() перенаправит на transaction.html -->


<!-- ── [3] Стили для статуса awaiting_payment ────────────────────
     Добавь в <style> в home.html:
-->
<style>
.oc.st-awaiting_payment {
  border-color: rgba(37,99,235,.25);
  background: linear-gradient(135deg, rgba(37,99,235,.03), transparent);
}
.oc.st-payment_failed {
  border-color: rgba(220,38,38,.2);
  background: rgba(220,38,38,.02);
}
/* Pay button внутри карточки заказа */
.oc-pay-btn {
  margin-top: 10px;
  width: 100%;
  padding: 10px;
  background: linear-gradient(135deg, var(--acc), var(--acc2));
  border: none;
  border-radius: 10px;
  color: #fff;
  font-family: var(--fd);
  font-weight: 800;
  font-size: .74rem;
  cursor: pointer;
  box-shadow: 0 3px 10px var(--acc-shadow);
  transition: opacity .15s;
}
.oc-pay-btn:hover { opacity: .88; }
</style>
