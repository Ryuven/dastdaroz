<!DOCTYPE html>
<!--

║              ШАБЛОН DASTDAROZ — ФОРУМ                            ║
╠══════════════════════════════════════════════════════════════════╣
║  Зона редактирования: блок между КОНТЕНТ START / КОНТЕНТ END     ║
║  Плюс: NT-оверлей, FAB и форумный <script type="module">         ║
╚══════════════════════════════════════════════════════════════════╝
-->
<html lang="ru">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover"/>
<meta name="mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<title>Форум - dastdaroz</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@700;800;900&family=Inter:wght@400;500;600;700&display=swap"/>
<style>
/* ══ TEMPLATE TOKENS — НЕ ТРОГАТЬ ══════════════════════════════ */
:root {
  --acc:#1a9e4a; --acc2:#22c55e; --accd:rgba(26,158,74,.09); --accg:rgba(26,158,74,.2);
  --bg:#f3f7f4;  --s1:#ffffff;   --s2:#edf4ef;
  --b0:rgba(0,0,0,.07); --b1:rgba(0,0,0,.15);
  --tx:#171f1a;  --tx2:#3d5244; --tx3:#7a9882; --txd:#b0c4b8;
  --fd:'Unbounded',sans-serif; --fs:'Inter',system-ui,sans-serif;
  --safe-t:env(safe-area-inset-top,0px);
  --safe-b:env(safe-area-inset-bottom,0px);
  --ease:cubic-bezier(.32,0,.18,1);
}
*,*::before,*::after { box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent }
html,body { -webkit-text-size-adjust:100% }
body {
  background:var(--bg); color:var(--tx);
  font-family:var(--fs);
  min-height:100svh;
  display:flex; flex-direction:column;
  padding-top:var(--safe-t);
  -webkit-font-smoothing:antialiased;
}
a { color:inherit; text-decoration:none }

/* ── HEADER ── */
.header {
  position:sticky; top:0;
  display:flex; align-items:center; justify-content:space-between;
  padding:0 20px; height:54px;
  border-bottom:1px solid var(--b0);
  background:var(--s1); z-index:100;
}
.logo { display:flex; align-items:center; height:100% }
.logo img { height:28px; width:auto; object-fit:contain; display:block }
.header-right { display:flex; align-items:center; gap:10px }

/* ── AVATAR BUTTON ── */
.avatar-btn {
  width:36px; height:36px; border-radius:50%; flex-shrink:0;
  background:var(--s2); border:2px solid var(--b0);
  display:flex; align-items:center; justify-content:center;
  cursor:pointer; outline:none;
  transition:border-color .15s,background .15s;
  color:var(--tx3); font-family:var(--fd); font-weight:900; font-size:.75rem;
}
.avatar-btn:active  { background:var(--accd); border-color:var(--acc) }
.avatar-btn.authed  { background:var(--accd); border-color:var(--accg); color:var(--acc) }

/* ── SEARCH BUTTON ── */
.search-btn {
  width:36px; height:36px; border-radius:50%; flex-shrink:0;
  background:var(--s2); border:2px solid var(--b0);
  display:flex; align-items:center; justify-content:center;
  cursor:pointer; outline:none;
  transition:border-color .15s,background .15s; color:var(--tx3);
}
.search-btn:active { background:var(--accd); border-color:var(--acc) }
.search-btn.active { background:var(--accd); border-color:var(--accg); color:var(--acc) }

/* ── SEARCH PANEL ── */
.search-panel {
  position:sticky; top:54px; z-index:99;
  background:var(--s1); border-bottom:1px solid var(--b0); display:none;
}
.search-panel.open { display:block }
.search-bar {
  display:flex; align-items:center; gap:10px;
  padding:10px 16px; border-bottom:1px solid var(--b0);
}
.search-bar-ico { color:var(--tx3); flex-shrink:0; display:flex }
.search-input {
  flex:1; border:none; outline:none; background:none;
  font-family:var(--fs); font-size:.9rem; color:var(--tx); caret-color:var(--acc);
}
.search-input::placeholder { color:var(--tx3) }
.search-clear {
  width:26px; height:26px; border-radius:50%; border:none;
  background:var(--s2);
  display:flex; align-items:center; justify-content:center;
  cursor:pointer; color:var(--tx3); flex-shrink:0;
  opacity:0; pointer-events:none; transition:opacity .12s;
}
.search-clear.visible { opacity:1; pointer-events:auto }
.search-clear:active  { background:var(--b0) }
.search-results { max-height:52vh; overflow-y:auto; -webkit-overflow-scrolling:touch }
.search-result-item {
  display:block; padding:12px 16px;
  text-decoration:none; color:inherit;
  border-bottom:1px solid var(--b0); transition:background .1s; cursor:pointer;
}
.search-result-item:last-child { border-bottom:none }
.search-result-item:active { background:var(--s2) }
.sri-title  { font-family:var(--fd); font-weight:800; font-size:.85rem; color:var(--tx); margin-bottom:3px }
.sri-snippet {
  font-size:.75rem; color:var(--tx3); line-height:1.5;
  overflow:hidden; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical;
}
.sri-snippet mark,.sri-title mark {
  background:var(--accd); color:var(--acc); border-radius:3px; padding:0 2px;
  font-weight:600; font-style:normal;
}
.search-status { padding:22px 16px; text-align:center; font-size:.82rem; color:var(--tx3); line-height:1.5 }

/* ── SCROLL / CONTENT / FOOTER ── */
.scroll  { flex:1 }
.content { padding:20px }
.footer  { background:var(--s1); border-top:1px solid var(--b0) }
.divider { height:1px; background:var(--b0); margin:0 20px }

/* ── CONTACTS ── */
.contacts { padding:3px 0 }
.contact-item {
  display:flex; align-items:center; gap:12px;
  padding:9px 20px; text-decoration:none; color:inherit; transition:background .1s;
}
.contact-item.clickable { cursor:pointer }
.contact-item.clickable:active { background:var(--s2) }
.ci-icon  { width:28px; height:28px; flex-shrink:0; display:flex; align-items:center; justify-content:center; color:var(--tx3) }
.ci-body  { flex:1; min-width:0 }
.ci-val   { font-family:var(--fd); font-size:.8rem; font-weight:700; color:var(--tx2); overflow:hidden; text-overflow:ellipsis; white-space:nowrap }
.ci-sub   { font-family:var(--fd); font-size:.55rem; font-weight:700; letter-spacing:.03em; color:var(--tx3); margin-top:1px }
.ci-arrow { color:var(--txd); flex-shrink:0 }

/* ── SOCIALS ── */
.socials-wrap { padding:8px 20px calc(10px + var(--safe-b)) }
.socials { display:flex; gap:9px }
.soc-btn {
  width:42px; height:42px; border-radius:11px;
  display:flex; align-items:center; justify-content:center;
  color:#fff; cursor:pointer; transition:opacity .12s,transform .12s; flex-shrink:0;
}
.soc-btn:active { opacity:.7; transform:scale(.93) }
.soc-btn.fb { background:#1877f2 }
.soc-btn.ig { background:linear-gradient(135deg,#f09433,#e6683c,#dc2743,#cc2366,#bc1888) }
.soc-btn.tg { background:#2aabee }
.soc-btn.yt { background:#ff0000 }

/* ── PROFILE OVERLAY ── */
.overlay {
  position:fixed; inset:0; z-index:500;
  background:rgba(0,0,0,.38);
  display:flex; align-items:flex-end;
  opacity:0; pointer-events:none; transition:opacity .22s;
  backdrop-filter:blur(3px); -webkit-backdrop-filter:blur(3px);
}
.overlay.open { opacity:1; pointer-events:auto }
.sheet {
  width:100%; background:var(--s1);
  border-radius:22px 22px 0 0;
  padding-bottom:calc(20px + var(--safe-b));
  transform:translateY(100%); transition:transform .3s var(--ease); overflow:hidden;
}
.overlay.open .sheet { transform:translateY(0) }
.sheet-handle { width:38px; height:4px; border-radius:2px; background:var(--b1); margin:12px auto 0 }
.sheet-head   { display:flex; align-items:center; gap:14px; padding:18px 20px 14px; border-bottom:1px solid var(--b0) }
.sheet-ava    {
  width:52px; height:52px; border-radius:50%; flex-shrink:0;
  background:var(--accd); border:2px solid var(--accg);
  display:flex; align-items:center; justify-content:center;
  font-family:var(--fd); font-weight:900; font-size:1.3rem; color:var(--acc);
}
.sheet-name   { font-family:var(--fd); font-weight:900; font-size:1.05rem; color:var(--tx); line-height:1.2 }
.sheet-phone  { font-size:.75rem; color:var(--tx3); margin-top:4px; font-weight:500; letter-spacing:.02em }
.sheet-row {
  display:flex; align-items:center; gap:13px;
  padding:13px 20px; border-bottom:1px solid var(--b0);
  cursor:pointer; transition:background .1s;
  text-decoration:none; color:inherit;
}
.sheet-row:active   { background:var(--s2) }
.sheet-row-ico {
  width:32px; height:32px; border-radius:10px;
  background:var(--s2);
  display:flex; align-items:center; justify-content:center;
  color:var(--tx3); flex-shrink:0;
}
.sheet-row-lbl { flex:1; font-size:.84rem; font-weight:600; color:var(--tx2) }
.sheet-row-arr { color:var(--txd) }
.sheet-logout {
  margin:14px 20px 0; width:calc(100% - 40px);
  padding:14px; border:none; border-radius:13px;
  background:rgba(220,38,38,.07); color:#dc2626;
  font-family:var(--fd); font-weight:900; font-size:.8rem;
  letter-spacing:.07em; text-transform:uppercase;
  cursor:pointer; display:flex; align-items:center; justify-content:center; gap:8px;
  transition:background .12s;
}
.sheet-logout:active { background:rgba(220,38,38,.15) }

/* ══════════════════════════════════════════════════════════════
   ФОРУМ — CUSTOM STYLES
══════════════════════════════════════════════════════════════ */

/* Views */
.forum-view        { display:none }
.forum-view.active { display:block }

/* Sticky sub-header */
.view-bar {
  position:sticky; top:54px; z-index:90;
  margin:-20px -20px 16px;
  padding:10px 16px;
  background:var(--s1); border-bottom:1px solid var(--b0);
  display:flex; align-items:center; gap:10px;
}
.view-back {
  width:34px; height:34px; border-radius:50%; border:1.5px solid var(--b0);
  background:var(--s2); display:flex; align-items:center; justify-content:center;
  cursor:pointer; color:var(--tx3); flex-shrink:0; transition:all .14s;
}
.view-back:active { background:var(--accd); border-color:var(--acc); color:var(--acc) }
.view-title {
  font-family:var(--fd); font-weight:900; font-size:.95rem; color:var(--tx);
  flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
}

/* Thread rows */
.threads-list { background:var(--s1); border:1.5px solid var(--b0); border-radius:13px; overflow:hidden }
.thread-row {
  display:block; padding:13px 14px;
  border-bottom:1px solid var(--b0);
  cursor:pointer; transition:background .1s;
}
.thread-row:last-child  { border-bottom:none }
.thread-row:active      { background:var(--s2) }
.t-top    { display:flex; align-items:flex-start; gap:8px; margin-bottom:5px }
.t-pin    { color:var(--acc); flex-shrink:0; margin-top:1px }
.t-title  { font-family:var(--fd); font-weight:800; font-size:.87rem; color:var(--tx); line-height:1.3; flex:1; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden }
.t-cat-tag { font-size:.54rem; font-weight:700; padding:2px 8px; border-radius:99px; flex-shrink:0; white-space:nowrap; background:var(--accd); color:var(--acc) }
.t-bottom  { display:flex; align-items:center; gap:8px; flex-wrap:wrap }
.t-author  { display:flex; align-items:center; gap:5px; font-size:.64rem; color:var(--tx3) }
.t-ava-sm  { width:18px; height:18px; border-radius:50%; background:var(--accd); color:var(--acc); font-family:var(--fd); font-weight:900; font-size:.5rem; display:flex; align-items:center; justify-content:center; flex-shrink:0 }
.t-time    { font-size:.6rem; color:var(--txd) }
.t-stats   { display:flex; align-items:center; gap:8px; margin-left:auto }
.t-stat    { display:flex; align-items:center; gap:3px; font-size:.62rem; color:var(--tx3) }

/* Thread view */
.thread-head  { background:var(--s1); border:1.5px solid var(--b0); border-radius:13px; padding:14px; margin-bottom:10px }
.t-cat-pill   { display:inline-flex; align-items:center; gap:5px; font-size:.58rem; font-weight:700; padding:2px 9px; border-radius:99px; background:var(--accd); color:var(--acc); margin-bottom:8px }
.t-h1         { font-family:var(--fd); font-weight:900; font-size:1.05rem; color:var(--tx); line-height:1.3; margin-bottom:8px }
.t-hmeta      { display:flex; align-items:center; gap:10px; flex-wrap:wrap }
.t-hstat      { display:flex; align-items:center; gap:4px; font-size:.62rem; color:var(--tx3) }

/* Post cards */
.post      { background:var(--s1); border:1.5px solid var(--b0); border-radius:14px; padding:14px; margin-bottom:8px }
.post.op   { border-color:var(--accg) }
.post-head { display:flex; align-items:center; gap:10px; margin-bottom:10px }
.post-ava  {
  width:36px; height:36px; border-radius:50%;
  background:var(--accd); border:2px solid var(--accg);
  display:flex; align-items:center; justify-content:center;
  font-family:var(--fd); font-weight:900; font-size:.78rem; color:var(--acc); flex-shrink:0;
}
.post-ava.reply { background:var(--s2); border-color:var(--b1); color:var(--tx3) }
.post-meta  { flex:1; min-width:0 }
.post-name  { font-family:var(--fd); font-weight:800; font-size:.82rem; color:var(--tx) }
.post-time  { font-size:.6rem; color:var(--tx3); margin-top:2px }
.op-badge   { font-size:.5rem; font-weight:700; padding:2px 7px; border-radius:99px; background:var(--accd); color:var(--acc); letter-spacing:.04em; text-transform:uppercase }
.post-body  { font-size:.84rem; color:var(--tx2); line-height:1.72; white-space:pre-wrap; word-break:break-word }
.post-foot  { display:flex; align-items:center; gap:8px; margin-top:12px; padding-top:10px; border-top:1px solid var(--b0) }
.like-btn {
  display:flex; align-items:center; gap:5px;
  padding:5px 12px; border-radius:99px;
  border:1.5px solid var(--b0); background:none;
  font-family:var(--fs); font-size:.68rem; font-weight:600;
  color:var(--tx3); cursor:pointer; transition:all .14s;
}
.like-btn.liked { border-color:var(--acc); color:var(--acc); background:var(--accd) }
.like-btn:active { opacity:.7 }
.report-btn {
  display:flex; align-items:center; gap:4px;
  padding:5px 10px; border-radius:99px; border:none;
  background:none; font-family:var(--fs); font-size:.64rem;
  color:var(--txd); cursor:pointer; margin-left:auto; transition:color .14s;
}
.report-btn:active { color:var(--tx3) }

/* Replies divider */
.replies-div     { display:flex; align-items:center; gap:10px; margin:12px 0 10px }
.replies-div-line { flex:1; height:1px; background:var(--b0) }
.replies-div-lbl  { font-size:.58rem; letter-spacing:.18em; text-transform:uppercase; color:var(--tx3); font-weight:700; white-space:nowrap }

/* Sticky reply form */
.reply-form {
  position:sticky; bottom:0;
  margin:16px -20px -20px;
  background:var(--s1); border-top:1px solid var(--b0);
  padding:10px 16px calc(12px + var(--safe-b)); z-index:80;
}
.reply-row     { display:flex; align-items:flex-end; gap:8px }
.reply-ava     { width:30px; height:30px; border-radius:50%; background:var(--accd); border:2px solid var(--accg); display:flex; align-items:center; justify-content:center; font-family:var(--fd); font-weight:900; font-size:.66rem; color:var(--acc); flex-shrink:0 }
.reply-textarea {
  flex:1; background:var(--s2); border:1.5px solid var(--b0); border-radius:13px;
  padding:9px 12px; font-family:var(--fs); font-size:.82rem; color:var(--tx);
  outline:none; resize:none; min-height:38px; max-height:120px; overflow-y:auto;
  transition:border-color .15s; line-height:1.5;
}
.reply-textarea:focus       { border-color:var(--acc) }
.reply-textarea::placeholder { color:var(--tx3) }
.reply-send {
  width:38px; height:38px; border-radius:50%; border:none;
  background:var(--acc); color:#fff;
  display:flex; align-items:center; justify-content:center;
  cursor:pointer; flex-shrink:0; transition:opacity .14s;
}
.reply-send:active   { opacity:.75 }
.reply-send:disabled { opacity:.4; cursor:default }
.reply-login { text-align:center; padding:10px 0; font-size:.74rem; color:var(--tx3) }
.reply-login a { color:var(--acc); font-weight:700 }

/* New thread modal */
.nt-overlay {
  position:fixed; inset:0; z-index:400;
  background:rgba(0,0,0,.38);
  display:flex; align-items:flex-end;
  opacity:0; pointer-events:none; transition:opacity .22s;
  backdrop-filter:blur(3px); -webkit-backdrop-filter:blur(3px);
}
.nt-overlay.open { opacity:1; pointer-events:auto }
.nt-sheet {
  width:100%; background:var(--s1);
  border-radius:22px 22px 0 0;
  padding-bottom:calc(20px + var(--safe-b));
  transform:translateY(100%); transition:transform .3s var(--ease);
  max-height:94svh; overflow-y:auto;
}
.nt-overlay.open .nt-sheet { transform:translateY(0) }
.nt-handle { width:38px; height:4px; border-radius:2px; background:var(--b1); margin:12px auto 0 }
.nt-head   { display:flex; align-items:center; justify-content:space-between; padding:14px 20px 12px; border-bottom:1px solid var(--b0) }
.nt-title  { font-family:var(--fd); font-weight:900; font-size:1rem; color:var(--tx) }
.nt-close  { width:30px; height:30px; border-radius:50%; border:1.5px solid var(--b0); background:var(--s2); display:flex; align-items:center; justify-content:center; cursor:pointer; color:var(--tx3) }
.nt-close:active { background:var(--accd); color:var(--acc) }
.nt-body   { padding:16px 20px }
.nf        { margin-bottom:13px }
.nl        { display:block; font-size:.56rem; letter-spacing:.15em; text-transform:uppercase; color:var(--tx3); font-weight:700; margin-bottom:5px }
.ni {
  width:100%; background:var(--s2); border:1.5px solid var(--b0);
  border-radius:11px; padding:10px 13px;
  font-family:var(--fs); font-size:.82rem; color:var(--tx);
  outline:none; transition:border-color .15s;
  -webkit-appearance:none; appearance:none;
}
.ni:focus         { border-color:var(--acc) }
.ni::placeholder  { color:var(--tx3) }
textarea.ni       { resize:vertical; min-height:100px; line-height:1.6 }
.nt-submit {
  width:100%; padding:14px; border:none; border-radius:13px;
  background:var(--acc); color:#fff;
  font-family:var(--fd); font-weight:900; font-size:.82rem;
  letter-spacing:.04em; cursor:pointer;
  transition:opacity .14s; margin-top:2px;
  display:flex; align-items:center; justify-content:center; gap:8px;
}
.nt-submit:active   { opacity:.82 }
.nt-submit:disabled { opacity:.4; cursor:default }

/* FAB */
.fab {
  position:fixed; right:20px; bottom:calc(22px + var(--safe-b));
  width:52px; height:52px; border-radius:50%;
  background:var(--acc); color:#fff; border:none;
  display:flex; align-items:center; justify-content:center;
  cursor:pointer;
  box-shadow:0 4px 18px rgba(26,158,74,.38),0 1px 4px rgba(0,0,0,.12);
  z-index:200; transition:transform .18s var(--ease),opacity .18s,box-shadow .18s;
}
.fab svg    { transition:transform .2s var(--ease) }
.fab:active { transform:scale(.9) }
.fab.hidden { opacity:0; pointer-events:none; transform:scale(.8) }

/* Skeleton shimmer */
@keyframes shimmer { 0%{background-position:-200% 0} 100%{background-position:200% 0} }
.sk {
  background:linear-gradient(90deg,var(--s2) 25%,rgba(0,0,0,.055) 50%,var(--s2) 75%);
  background-size:200% 100%;
  animation:shimmer 1.5s ease-in-out infinite;
  border-radius:6px;
}
.sk-row { padding:13px 14px; border-bottom:1px solid var(--b0) }
.sk-row:last-child { border-bottom:none }
.sk-top { display:flex; align-items:center; gap:8px; margin-bottom:9px }
.sk-bot { display:flex; align-items:center; gap:8px }

/* Empty state */
.f-empty     { text-align:center; padding:36px 16px }
.f-empty-ico { font-size:2rem; opacity:.22; margin-bottom:8px }
.f-empty-txt { font-size:.8rem; color:var(--tx3) }
.f-empty-btn {
  margin-top:14px; padding:9px 22px; border-radius:99px;
  border:1.5px solid var(--acc); background:none; color:var(--acc);
  font-family:var(--fd); font-weight:800; font-size:.74rem; cursor:pointer;
}
</style>
</head>
<body>

<!-- ── HEADER — НЕ ТРОГАТЬ ── -->
<div class="header">
  <div class="logo"><img src="dastdaroz.png" alt="dastdaroz"/></div>
  <div class="header-right">
    <button class="search-btn" id="search-btn" aria-label="Поиск">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
        <circle cx="11" cy="11" r="7"/><path d="M21 21l-4.35-4.35"/>
      </svg>

<script>
const SEARCH_PAGES = [];
(function(){
  const searchBtn    = document.getElementById('search-btn');
  const searchPanel  = document.getElementById('search-panel');
  const searchInput  = document.getElementById('search-input');
  const searchClear  = document.getElementById('search-clear');
  const searchResults= document.getElementById('search-results');
  let timer = null;

  function open()  { searchPanel.classList.add('open');    searchBtn.classList.add('active');    searchInput.focus(); }
  function close() { searchPanel.classList.remove('open'); searchBtn.classList.remove('active'); searchInput.value=''; searchClear.classList.remove('visible'); searchResults.innerHTML=''; }

  searchBtn.addEventListener('click', () => searchPanel.classList.contains('open') ? close() : open());
  searchClear.addEventListener('click', () => { searchInput.value=''; searchClear.classList.remove('visible'); searchResults.innerHTML=''; searchInput.focus(); });
  document.addEventListener('keydown', e => { if (e.key==='Escape' && searchPanel.classList.contains('open')) close(); });

  function esc(s){ return s.replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

  searchInput.addEventListener('input', () => {
    const q = searchInput.value.trim();
    searchClear.classList.toggle('visible', q.length > 0);
    clearTimeout(timer);
    timer = setTimeout(() => doSearch(q), 180);
  });

  function doSearch(q) {
    if (!q || q.length < 2) { searchResults.innerHTML = ''; return; }
    searchResults.innerHTML = `<div class="search-status">Поиск по форуму…</div>`;
  }
})();
</script>

<script type="module">
import { auth } from './firebase.js';
import { onAuthStateChanged, signOut } from 'https://www.gstatic.com/firebasejs/11.8.1/firebase-auth.js';

const avatarBtn   = document.getElementById('avatar-btn');
const avaIcon     = document.getElementById('ava-icon');
const avaInitials = document.getElementById('ava-initials');
const overlay     = document.getElementById('overlay');
const sheetAva    = document.getElementById('sheet-ava');
const sheetName   = document.getElementById('sheet-name');
const sheetPhone  = document.getElementById('sheet-phone');
const btnLogout   = document.getElementById('btn-logout');

let currentUser = null;

function initials(name) {
  if (!name) return '?';
  const p = name.trim().split(/\s+/);
  return p.length > 1 ? (p[0][0] + p[1][0]).toUpperCase() : p[0][0].toUpperCase();
}

function emailToPhone(email) {
  if (!email) return '—';
  const m = email.match(/^992(\d{9})@/);
  if (!m) return email;
  const d = m[1];
  return '+992 ' + d.slice(0,2) + ' ' + d.slice(2,5) + ' ' + d.slice(5,7) + ' ' + d.slice(7,9);
}

onAuthStateChanged(auth, user => {
  currentUser = user;
  if (user) {
    const ini = initials(user.displayName);
    avaIcon.style.display     = 'none';
    avaInitials.style.display = '';
    avaInitials.textContent   = ini;
    avatarBtn.classList.add('authed');
    sheetAva.textContent   = ini;
    sheetName.textContent  = user.displayName || 'Пользователь';
    sheetPhone.textContent = emailToPhone(user.email);
  } else {
    avaIcon.style.display     = '';
    avaInitials.style.display = 'none';
    avatarBtn.classList.remove('authed');
  }
  window.forumUser = user;
  if (window.onForumAuthReady) window.onForumAuthReady(user);
});

avatarBtn.addEventListener('click', () => {
  if (currentUser) {
    overlay.classList.add('open');
  } else {
    window.location.href = 'login.html';
  }
});

overlay.addEventListener('click', e => {
  if (e.target === overlay) overlay.classList.remove('open');
});

btnLogout.addEventListener('click', async () => {
  await signOut(auth);
  overlay.classList.remove('open');
});
</script>

  renderReplyForm();
  if (!currentThreadId) return;
  if (unsubReplies) { unsubReplies(); unsubReplies = null; }

  try {
    const tSnap = await getDoc(doc(db, 'forum_threads', currentThreadId));
    if (!tSnap.exists()) {
      el.innerHTML = '<div class="f-empty"><div class="f-empty-ico">🗑️</div><div class="f-empty-txt">Тема не найдена</div></div>';
      return;
    }
    const thread = { id: tSnap.id, ...tSnap.data() };
    document.getElementById('thread-view-title').textContent = thread.title || 'Тема';
    updateDoc(doc(db, 'forum_threads', currentThreadId), { views: increment(1) }).catch(() => {});
    renderThreadStatic(thread);
    renderReplyForm();

    const rQuery = query(collection(db, 'forum_replies'), where('threadId', '==', currentThreadId));
    unsubReplies = onSnapshot(rQuery, snap => {
      const replies = snap.docs
        .map(d => ({ id: d.id, ...d.data() }))
        .sort((a, b) => (a.createdAt?.seconds || 0) - (b.createdAt?.seconds || 0));
      renderReplies(replies);
      const badge = document.getElementById('t-reply-count');
      if (badge) badge.textContent = replies.length + ' ' + pluralRu(replies.length, 'ответ','ответа','ответов');
    }, err => { console.warn('Replies listener:', err); });

  } catch(e) {
    el.innerHTML = '<div class="f-empty"><div class="f-empty-ico">⚠️</div><div class="f-empty-txt">Ошибка подключения</div></div>';
  }
}

/* ═══════════════════════════════════════════════════════════

═══════════════════════════════════════════════════════════ */
window.toggleLike = async function(btn) {
  if (!me) { window.location.href = 'login.html'; return; }
  const id    = btn.dataset.id;
  const type  = btn.dataset.type;
  const liked = btn.classList.contains('liked');
  const collRef = type === 'thread' ? 'forum_threads' : 'forum_replies';

  btn.classList.toggle('liked', !liked);
  const svg  = btn.querySelector('svg');
  const span = btn.querySelector('span');
  if (svg)  svg.setAttribute('fill', !liked ? 'currentColor' : 'none');
  if (span) span.textContent = Math.max(0, (parseInt(span.textContent) || 0) + (!liked ? 1 : -1));

  try {
    await updateDoc(doc(db, collRef, id), {
      likedBy:   liked ? arrayRemove(me.uid) : arrayUnion(me.uid),
      likeCount: increment(liked ? -1 : 1),
    });
  } catch(e) {
    btn.classList.toggle('liked', liked);
    if (svg)  svg.setAttribute('fill', liked ? 'currentColor' : 'none');
    if (span) span.textContent = Math.max(0, (parseInt(span.textContent) || 0) + (liked ? 1 : -1));
  }
};

window.submitReply = async function() {
  if (!me) { window.location.href = 'login.html'; return; }
  const ta  = document.getElementById('r-input');
  const btn = document.getElementById('r-send');
  if (!ta) return;
  const body = ta.value.trim();
  if (!body) return;
  if (btn) btn.disabled = true;
  try {
    await addDoc(collection(db, 'forum_replies'), {
      threadId:   currentThreadId,
      body,
      authorId:   me.uid,
      authorName: me.displayName || 'Пользователь',
      likeCount:  0,
      likedBy:    [],
      createdAt:  serverTimestamp(),
    });
    await updateDoc(doc(db, 'forum_threads', currentThreadId), {
      replyCount:   increment(1),
      lastActivity: serverTimestamp(),
      lastReplyBy:  me.displayName || 'Пользователь',
    });
    ta.value = '';
    ta.style.height = 'auto';
    setTimeout(() => window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' }), 400);
  } catch(e) {
    alert('Ошибка отправки');
  }
  if (btn) btn.disabled = false;
};

window.submitNewThread = async function() {
  if (!me) { closeNT(); window.location.href = 'login.html'; return; }
  const title = document.getElementById('nt-title').value.trim();
  const body  = document.getElementById('nt-body').value.trim();
  if (!title || !body) {
    if (!title) document.getElementById('nt-title').style.borderColor = 'var(--acc)';
    if (!body)  document.getElementById('nt-body').style.borderColor  = 'var(--acc)';
    return;
  }
  const btn = document.getElementById('nt-submit');
  btn.disabled = true; btn.textContent = 'Публикуется…';
  try {
    const ref = await addDoc(collection(db,'forum_threads'), {
      title, body,
      categoryId:   'general',
      categoryName: 'Общее',
      authorId:     me.uid,
      authorName:   me.displayName || 'Пользователь',
      likeCount:    0,
      likedBy:      [],
      replyCount:   0,
      views:        0,
      pinned:       false,
      createdAt:    serverTimestamp(),
      lastActivity: serverTimestamp(),
    });
    closeNT();
    goThread(ref.id);
  } catch(e) {
    alert('Ошибка публикации: ' + e.message);
  }
  btn.disabled = false;
  btn.innerHTML = `<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M22 2L11 13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg> Опубликовать`;
};

window.scrollToReply = function() {
  const ta = document.getElementById('r-input');
  if (ta) { ta.focus(); ta.scrollIntoView({ behavior:'smooth', block:'center' }); }
  else window.location.href = 'login.html';
};

/* ── NT MODAL ── */
window.openNT = function() {
  if (!me) { window.location.href = 'login.html'; return; }
  document.getElementById('nt-title').value = '';
  document.getElementById('nt-body').value  = '';
  document.getElementById('nt-title').style.borderColor = '';
  document.getElementById('nt-body').style.borderColor  = '';
  document.getElementById('nt-overlay').classList.add('open');
};
window.closeNT = function() {
  document.getElementById('nt-overlay').classList.remove('open');
};
document.getElementById('nt-overlay').addEventListener('click', e => {
  if (e.target === document.getElementById('nt-overlay')) closeNT();
});

/* ── HELPERS ── */
function esc(s) {
  return String(s || '').replace(/[&<>"']/g, c =>
    ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function ini(name) {
  if (!name) return '?';
  const p = name.trim().split(/\s+/);
  return p.length > 1 ? (p[0][0] + p[1][0]).toUpperCase() : p[0].slice(0,2).toUpperCase();
}
function pluralRu(n, one, few, many) {
  const m = Math.abs(n) % 100;
  const m2 = m % 10;
  if (m >= 11 && m <= 19) return many;
  if (m2 === 1) return one;
  if (m2 >= 2 && m2 <= 4) return few;
  return many;
}
function timeAgo(ts) {
  if (!ts) return '';
  const d = ts.toDate ? ts.toDate() : new Date(ts);
  const s = Math.floor((Date.now() - d.getTime()) / 1000);
  if (s < 55)     return 'только что';
  if (s < 3540)   return Math.round(s/60)    + ' мин. назад';
  if (s < 82800)  return Math.round(s/3600)  + ' ч. назад';
  if (s < 518400) return Math.round(s/86400) + ' дн. назад';
  return d.toLocaleDateString('ru-RU', { day:'2-digit', month:'short' });
}
