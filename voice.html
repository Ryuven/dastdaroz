<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Голосовые комнаты</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: Arial, sans-serif;
            background: #1a1a2e;
            color: #eee;
            padding: 20px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .container {
            max-width: 600px;
            width: 100%;
            background: #16213e;
            border-radius: 16px;
            padding: 24px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.4);
        }
        h1 {
            text-align: center;
            margin-bottom: 20px;
            font-size: 24px;
            color: #0f3460;
        }
        .status {
            text-align: center;
            padding: 10px;
            border-radius: 8px;
            margin-bottom: 16px;
            background: #0f3460;
            color: #e94560;
            font-weight: bold;
            font-size: 14px;
        }
        .status.online { color: #4ecca3; }
        .status.offline { color: #e94560; }
        .status.waiting { color: #f39c12; }
        
        .room-list {
            list-style: none;
            margin: 16px 0;
            max-height: 200px;
            overflow-y: auto;
        }
        .room-list li {
            background: #1a1a40;
            padding: 12px 16px;
            margin: 6px 0;
            border-radius: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-left: 4px solid #4ecca3;
        }
        .room-list button {
            background: #4ecca3;
            border: none;
            padding: 6px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            color: #1a1a2e;
            transition: 0.2s;
        }
        .room-list button:hover { transform: scale(1.05); }
        .room-list button:disabled {
            opacity: 0.4;
            cursor: not-allowed;
            transform: none;
        }
        
        .input-group {
            display: flex;
            gap: 10px;
            margin: 16px 0;
        }
        .input-group input {
            flex: 1;
            padding: 10px 14px;
            border-radius: 8px;
            border: 2px solid #0f3460;
            background: #1a1a40;
            color: #eee;
            font-size: 14px;
            outline: none;
        }
        .input-group input:focus { border-color: #4ecca3; }
        .input-group button {
            padding: 10px 20px;
            border: none;
            border-radius: 8px;
            background: #e94560;
            color: #fff;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
        }
        .input-group button:hover { background: #c73652; }
        .input-group button:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }
        
        .participants {
            margin: 16px 0;
            padding: 12px;
            background: #0f3460;
            border-radius: 8px;
            font-size: 14px;
            min-height: 40px;
        }
        .participants span { color: #4ecca3; }
        
        .controls {
            display: flex;
            gap: 10px;
            margin-top: 12px;
        }
        .controls button {
            flex: 1;
            padding: 10px;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
        }
        .controls .mute { background: #f39c12; color: #1a1a2e; }
        .controls .mute.muted { background: #e94560; color: #fff; }
        .controls .leave { background: #e94560; color: #fff; }
        .controls button:hover { transform: scale(1.03); }
        
        .hidden { display: none !important; }
        
        #microphoneRequest {
            background: #0f3460;
            padding: 20px;
            border-radius: 12px;
            text-align: center;
            margin: 20px 0;
        }
        #microphoneRequest button {
            background: #4ecca3;
            border: none;
            padding: 12px 30px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            color: #1a1a2e;
            cursor: pointer;
            transition: 0.2s;
            margin-top: 12px;
        }
        #microphoneRequest button:hover { transform: scale(1.05); }
        #microphoneRequest .error {
            color: #e94560;
            margin-top: 10px;
            font-size: 14px;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>🎤 Голосовые комнаты</h1>
    
    <div id="status" class="status offline">🔴 Подключение к PeerJS...</div>
    
    <!-- Запрос микрофона -->
    <div id="microphoneRequest">
        <p style="font-size: 16px; margin-bottom: 8px;">🎙️ Для работы голосовых комнат нужен доступ к микрофону</p>
        <button id="requestMicBtn">Разрешить микрофон</button>
        <div id="micError" class="error hidden"></div>
    </div>
    
    <!-- Создание комнаты (скрыто пока нет микрофона) -->
    <div id="roomControls" class="hidden">
        <div class="input-group">
            <input id="roomNameInput" type="text" placeholder="Название комнаты (например: lobby)" />
            <button id="createRoomBtn">➕ Создать</button>
        </div>
        
        <!-- Список комнат -->
        <div id="roomsContainer">
            <p style="font-size:14px; color:#888; margin-bottom:8px;">Доступные комнаты:</p>
            <ul id="roomList" class="room-list"></ul>
        </div>
        
        <!-- Текущий статус -->
        <div id="roomStatus" class="hidden">
            <hr style="border-color:#0f3460; margin:16px 0;" />
            <p>📍 Комната: <strong id="currentRoomName">—</strong></p>
            <div id="participantsList" class="participants">👤 Участники: <span id="participantsCount">0</span></div>
            
            <div class="controls">
                <button id="muteBtn" class="mute">🔊 Микрофон вкл</button>
                <button id="leaveBtn" class="leave">🚪 Покинуть</button>
            </div>
        </div>
    </div>
</div>

<!-- Подключаем библиотеки -->
<script src="https://unpkg.com/peerjs@1.5.1/dist/peerjs.min.js"></script>
<script type="importmap">
{
    "imports": {
        "firebase/app": "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js",
        "firebase/firestore": "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js"
    }
}
</script>

<script type="module">
// ============================================
// 1. НАСТРОЙКА FIREBASE (ВАШ КОНФИГ)
// ============================================
import { initializeApp } from "firebase/app";
import { 
    getFirestore, 
    collection, 
    doc, 
    setDoc, 
    deleteDoc, 
    onSnapshot, 
    serverTimestamp,
    getDoc,
    query,
    limit
} from "firebase/firestore";

const firebaseConfig = {
    apiKey: "AIzaSyDCtMunMRiOWKSGh939BEU2TvhEgv_wB60",
    authDomain: "pulsar-galelium.firebaseapp.com",
    databaseURL: "https://pulsar-galelium-default-rtdb.firebaseio.com",
    projectId: "pulsar-galelium",
    storageBucket: "pulsar-galelium.firebasestorage.app",
    messagingSenderId: "407132877855",
    appId: "1:407132877855:web:fd29af874d74dcda90912a"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

// ============================================
// 2. АВТОМАТИЧЕСКОЕ СОЗДАНИЕ КОЛЛЕКЦИИ
// ============================================
async function ensureCollectionExists() {
    try {
        const roomsQuery = query(collection(db, 'rooms'), limit(1));
        const snapshot = await getDoc(roomsQuery);
        if (snapshot.empty) {
            const testDoc = doc(db, 'rooms', '_temp_');
            await setDoc(testDoc, { 
                _temp: true,
                createdAt: serverTimestamp() 
            });
            await deleteDoc(testDoc);
            console.log('✅ Коллекция rooms создана автоматически');
        }
    } catch (error) {
        console.warn('⚠️ Не удалось проверить коллекцию:', error);
    }
}

// ============================================
// 3. ГЕНЕРАЦИЯ UNIQUE ID ПОЛЬЗОВАТЕЛЯ
// ============================================
let userId = localStorage.getItem('peerUserId');
if (!userId) {
    userId = 'user_' + Math.random().toString(36).slice(2, 10);
    localStorage.setItem('peerUserId', userId);
}

// ============================================
// 4. ЗАПРОС МИКРОФОНА
// ============================================
const statusEl = document.getElementById('status');
const micRequestDiv = document.getElementById('microphoneRequest');
const requestMicBtn = document.getElementById('requestMicBtn');
const micErrorEl = document.getElementById('micError');
const roomControls = document.getElementById('roomControls');

let localStream = null;
let micGranted = false;

requestMicBtn.addEventListener('click', async () => {
    try {
        micErrorEl.classList.add('hidden');
        micErrorEl.textContent = '';
        requestMicBtn.disabled = true;
        requestMicBtn.textContent = '⏳ Запрос...';
        
        localStream = await navigator.mediaDevices.getUserMedia({ 
            audio: { 
                echoCancellation: true,
                noiseSuppression: true,
                autoGainControl: true
            } 
        });
        
        micGranted = true;
        micRequestDiv.style.display = 'none';
        roomControls.classList.remove('hidden');
        statusEl.textContent = '✅ Микрофон доступен';
        statusEl.className = 'status online';
        
        initPeer();
        await ensureCollectionExists();
        loadRooms();
        
    } catch (error) {
        console.error('Ошибка доступа к микрофону:', error);
        micErrorEl.classList.remove('hidden');
        micErrorEl.textContent = '❌ Не удалось получить доступ к микрофону. Разрешите доступ в браузере и попробуйте снова.';
        requestMicBtn.disabled = false;
        requestMicBtn.textContent = '🔄 Попробовать снова';
        statusEl.textContent = '❌ Нет доступа к микрофону';
        statusEl.className = 'status offline';
    }
});

// ============================================
// 5. ПОДКЛЮЧЕНИЕ К PEERJS
// ============================================
let peer = null;
let currentRoomId = null;
let currentCalls = {};
let roomsUnsubscribe = null;

function initPeer() {
    peer = new Peer(userId, {
        host: '0.peerjs.com',
        port: 443,
        secure: true,
        debug: 2
    });
    
    peer.on('open', (id) => {
        statusEl.textContent = '🟢 Peer готов: ' + id;
        statusEl.className = 'status online';
        console.log('Peer ID:', id);
    });
    
    peer.on('error', (err) => {
        console.error('Peer error:', err);
        statusEl.textContent = '❌ Ошибка Peer: ' + err.message;
        statusEl.className = 'status offline';
    });
    
    peer.on('call', (call) => {
        if (!localStream) {
            console.warn('Нет локального потока');
            return;
        }
        call.answer(localStream);
        call.on('stream', (remoteStream) => {
            addRemoteAudio(remoteStream, call.peer);
        });
        call.on('close', () => {
            removeRemoteAudio(call.peer);
        });
        currentCalls[call.peer] = call;
        updateParticipantsCount();
    });
}

// ============================================
// 6. ЗАГРУЗКА КОМНАТ ИЗ FIRESTORE
// ============================================
const roomListEl = document.getElementById('roomList');
const roomNameInput = document.getElementById('roomNameInput');
const createBtn = document.getElementById('createRoomBtn');
const roomStatus = document.getElementById('roomStatus');
const currentRoomNameEl = document.getElementById('currentRoomName');
const participantsCountEl = document.getElementById('participantsCount');
const muteBtn = document.getElementById('muteBtn');
const leaveBtn = document.getElementById('leaveBtn');

function loadRooms() {
    if (roomsUnsubscribe) {
        roomsUnsubscribe();
    }
    
    const roomsRef = collection(db, 'rooms');
    roomsUnsubscribe = onSnapshot(roomsRef, (snapshot) => {
        roomListEl.innerHTML = '';
        snapshot.forEach((doc) => {
            const data = doc.data();
            const roomId = doc.id;
            
            if (roomId === '_temp_') return;
            if (roomId === currentRoomId) return;
            
            const li = document.createElement('li');
            li.innerHTML = `
                <span>${roomId}</span>
                <button data-room="${roomId}">Войти</button>
            `;
            roomListEl.appendChild(li);
        });
        
        roomListEl.querySelectorAll('button[data-room]').forEach(btn => {
            btn.addEventListener('click', () => {
                const roomId = btn.dataset.room;
                joinRoom(roomId);
            });
        });
    }, (error) => {
        console.error('Ошибка загрузки комнат:', error);
        statusEl.textContent = '❌ Ошибка загрузки комнат';
        statusEl.className = 'status offline';
    });
}

// ============================================
// 7. СОЗДАНИЕ КОМНАТЫ
// ============================================
createBtn.addEventListener('click', async () => {
    const roomName = roomNameInput.value.trim() || 'lobby';
    roomNameInput.value = '';
    
    try {
        const roomDoc = doc(db, 'rooms', roomName);
        await setDoc(roomDoc, {
            host: userId,
            createdAt: serverTimestamp()
        });
        await joinRoom(roomName);
    } catch (error) {
        console.error('Ошибка создания:', error);
        alert('Не удалось создать комнату. Возможно, она уже существует.');
    }
});

// ============================================
// 8. ВХОД В КОМНАТУ
// ============================================
async function joinRoom(roomId) {
    if (currentRoomId) {
        await leaveRoom();
    }
    
    if (!localStream) {
        alert('Нет доступа к микрофону');
        return;
    }
    
    try {
        currentRoomId = roomId;
        currentRoomNameEl.textContent = roomId;
        roomStatus.classList.remove('hidden');
        updateParticipantsCount();
        
        const roomDoc = doc(db, 'rooms', roomId);
        await setDoc(roomDoc, {
            host: userId,
            updatedAt: serverTimestamp()
        }, { merge: true });
        
        const roomSnap = await getDoc(roomDoc);
        const hostId = roomSnap.data()?.host;
        
        if (hostId && hostId !== userId && peer) {
            const call = peer.call(hostId, localStream);
            call.on('stream', (remoteStream) => {
                addRemoteAudio(remoteStream, hostId);
            });
            call.on('close', () => {
                removeRemoteAudio(hostId);
            });
            currentCalls[hostId] = call;
            updateParticipantsCount();
        }
        
        statusEl.textContent = '🔊 В комнате ' + roomId;
        statusEl.className = 'status online';
        
    } catch (error) {
        console.error('Ошибка входа:', error);
        alert('Не удалось войти в комнату');
        currentRoomId = null;
        roomStatus.classList.add('hidden');
    }
}

// ============================================
// 9. УПРАВЛЕНИЕ АУДИО
// ============================================
function addRemoteAudio(stream, peerId) {
    const audio = document.createElement('audio');
    audio.id = 'audio-' + peerId;
    audio.srcObject = stream;
    audio.autoplay = true;
    document.body.appendChild(audio);
    updateParticipantsCount();
}

function removeRemoteAudio(peerId) {
    const audio = document.getElementById('audio-' + peerId);
    if (audio) {
        audio.remove();
    }
    delete currentCalls[peerId];
    updateParticipantsCount();
}

function updateParticipantsCount() {
    const count = Object.keys(currentCalls).length + (localStream ? 1 : 0);
    participantsCountEl.textContent = count;
}

// ============================================
// 10. КНОПКИ: МУТ / ВЫХОД
// ============================================
let isMuted = false;
muteBtn.addEventListener('click', () => {
    if (!localStream) return;
    isMuted = !isMuted;
    localStream.getAudioTracks().forEach(track => {
        track.enabled = !isMuted;
    });
    muteBtn.textContent = isMuted ? '🔇 Микрофон выкл' : '🔊 Микрофон вкл';
    muteBtn.classList.toggle('muted', isMuted);
});

leaveBtn.addEventListener('click', leaveRoom);

async function leaveRoom() {
    if (!currentRoomId) return;
    
    Object.values(currentCalls).forEach(call => {
        call.close();
    });
    currentCalls = {};
    
    document.querySelectorAll('audio[id^="audio-"]').forEach(el => el.remove());
    
    try {
        await deleteDoc(doc(db, 'rooms', currentRoomId));
    } catch (e) {
        console.warn('Не удалось удалить комнату:', e);
    }
    
    currentRoomId = null;
    roomStatus.classList.add('hidden');
    statusEl.textContent = '🟢 Вне комнаты';
    statusEl.className = 'status online';
    updateParticipantsCount();
    
    if (localStream) {
        localStream.getAudioTracks().forEach(track => track.enabled = true);
        isMuted = false;
        muteBtn.textContent = '🔊 Микрофон вкл';
        muteBtn.classList.remove('muted');
    }
}

// ============================================
// 11. ОБРАБОТКА ЗАКРЫТИЯ ВКЛАДКИ
// ============================================
window.addEventListener('beforeunload', () => {
    if (currentRoomId) {
        leaveRoom();
    }
});

</script>
</body>
</html>
