<!DOCTYPE html>
<!--
╔══════════════════════════════════════════════════════════════════╗
║              ШАБЛОН DASTDAROZ — ПРАВИЛА ДЛЯ ИИ                  ║
╠══════════════════════════════════════════════════════════════════╣
║                                                                  ║
║  ЕДИНСТВЕННАЯ ЗОНА РЕДАКТИРОВАНИЯ:                               ║
║  Блок между метками КОНТЕНТ START и КОНТЕНТ END внутри .content  ║
║                                                                  ║
║  ЧТО ЗАПРЕЩЕНО ТРОГАТЬ:                                          ║
║  ✗  <div class="header"> ... </div>   — топ-бар с логотипом     ║
║  ✗  <div class="footer"> ... </div>   — контакты и соцсети      ║
║  ✗  <div class="overlay"> ... </div>  — профиль bottom sheet     ║
║  ✗  <style> ... </style>              — все CSS переменные       ║
║  ✗  <script> ... </script>            — Firebase auth логика     ║
║  ✗  Классы: header, logo, footer, divider, contacts,            ║
║             socials-wrap, overlay, sheet и их дочерние эл-ты     ║
║                                                                  ║
║  ЧТО РАЗРЕШЕНО:                                                  ║
║  ✓  Заменить содержимое между КОНТЕНТ START / КОНТЕНТ END        ║
║  ✓  Добавлять новые CSS-классы в <style> для контента страницы   ║
║  ✓  Добавлять JS для контента (НЕ трогая существующий <script>)  ║
║  ✓  Менять <title> на название конкретной страницы               ║
║  ✓  Добавлять страницы в массив SEARCH_PAGES в первом <script>   ║
║                                                                  ║
╠══════════════════════════════════════════════════════════════════╣
║  КАК РАБОТАЕТ СКРОЛЛ И ФУТЕР — ВАЖНО                            ║
╠══════════════════════════════════════════════════════════════════╣
║                                                                  ║
║  Скролл — как на обычном сайте (вся страница), футер всегда      ║
║  внизу — даже если контента мало.                                ║
║                                                                  ║
║    body      → min-height:100svh + flex-column — тянется        ║
║                минимум на весь экран, НО может быть длиннее      ║
║    .header   → position:sticky; top:0 — прилипает к верху,      ║
║                всегда виден, НЕ скроллится                       ║
║    .scroll   → flex:1 — занимает всё свободное место,           ║
║                толкает футер вниз при коротком контенте          ║
║    .content  → обычный блок, растёт по контенту                  ║
║    .footer   → всегда у низа экрана (или ниже при длинном        ║
║                контенте), скроллится вместе со страницей         ║
║                                                                  ║
║  ✗  НЕ ДЕЛАЙ так (ломает скролл):                               ║
║     • overflow:hidden на body — убивает скролл страницы          ║
║     • height:100svh на body — обрезает контент (нужен min-height)║
║     • overflow:auto/scroll на .scroll или .content               ║
║     • position:fixed на .footer (он должен скроллиться!)         ║
║                                                                  ║
║  ✓  ДЕЛАЙ так:                                                   ║
║     • Просто кидай контент между КОНТЕНТ START / КОНТЕНТ END     ║
║     • Контент сам растёт, скролл страницы сам появляется         ║
║     • Если нужен отступ снизу у последнего блока — только        ║
║       margin-bottom на последнем элементе внутри .content        ║
║                                                                  ║
║  ДИЗАЙН-ТОКЕНЫ (используй их, не придумывай цвета):             ║
║  --acc   #1a9e4a  — основной зелёный                             ║
║  --acc2  #22c55e  — светлее                                      ║
║  --accd  rgba(26,158,74,.09)  — фон акцента                      ║
║  --bg    #f3f7f4  — фон страницы                                 ║
║  --s1    #ffffff  — карточки / шапки                             ║
║  --s2    #edf4ef  — вторичный фон                                ║
║  --tx    #171f1a  — основной текст                               ║
║  --tx2   #3d5244  — второстепенный                               ║
║  --tx3   #7a9882  — подписи / плейсхолдеры                       ║
║  --b0    rgba(0,0,0,.07)  — бордер                               ║
║  --fd    'Unbounded' — заголовки (font-weight 700-900)           ║
║  --fs    'Inter'   — текст                                       ║
║                                                                  ║
╚══════════════════════════════════════════════════════════════════╝
-->
<html lang="ru">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover"/>
<meta name="mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<title>Новости - dastdaroz</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@700;800;900&family=Inter:wght@400;500;600;700&display=swap"/>
<style>
:root{
  --acc:#1a9e4a;--acc2:#22c55e;--accd:rgba(26,158,74,.09);--accg:rgba(26,158,74,.2);
  --bg:#f3f7f4;--s1:#ffffff;--s2:#edf4ef;
  --b0:rgba(0,0,0,.07);--b1:rgba(0,0,0,.15);
  --tx:#171f1a;--tx2:#3d5244;--tx3:#7a9882;--txd:#b0c4b8;
  --fd:'Unbounded',sans-serif;--fs:'Inter',system-ui,sans-serif;
  --safe-t:env(safe-area-inset-top,0px);
  --safe-b:env(safe-area-inset-bottom,0px);
  --ease:cubic-bezier(.32,0,.18,1);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{-webkit-text-size-adjust:100%}
body{
  background:var(--bg);color:var(--tx);
  font-family:var(--fs);
  min-height:100svh;
  display:flex;flex-direction:column;
  padding-top:var(--safe-t);
  -webkit-font-smoothing:antialiased;
}
a{color:inherit;text-decoration:none}

/* ── HEADER ── */
.header{
  position:sticky;top:0;
  display:flex;align-items:center;justify-content:space-between;
  padding:0 20px;
  height:54px;
  border-bottom:1px solid var(--b0);
  background:var(--s1);
  z-index:100;
}
.logo{
  display:flex;align-items:center;
  height:100%;
}
.logo img{
  height:28px;width:auto;object-fit:contain;display:block;
}
.header-right{display:flex;align-items:center;gap:10px}

/* ── AVATAR BUTTON ── */
.avatar-btn{
  width:36px;height:36px;border-radius:50%;flex-shrink:0;
  background:var(--s2);
  border:2px solid var(--b0);
  display:flex;align-items:center;justify-content:center;
  cursor:pointer;outline:none;
  transition:border-color .15s,background .15s;
  color:var(--tx3);
  font-family:var(--fd);font-weight:900;font-size:.75rem;
}
.avatar-btn:active{background:var(--accd);border-color:var(--acc)}
.avatar-btn.authed{
  background:var(--accd);
  border-color:var(--accg);
  color:var(--acc);
}

/* ── SEARCH BUTTON ── */
.search-btn{
  width:36px;height:36px;border-radius:50%;flex-shrink:0;
  background:var(--s2);
  border:2px solid var(--b0);
  display:flex;align-items:center;justify-content:center;
  cursor:pointer;outline:none;
  transition:border-color .15s,background .15s;
  color:var(--tx3);
}
.search-btn:active{background:var(--accd);border-color:var(--acc)}
.search-btn.active{background:var(--accd);border-color:var(--accg);color:var(--acc)}

/* ── SEARCH PANEL ── */
.search-panel{
  position:sticky;
  top:54px;
  z-index:99;
  background:var(--s1);
  border-bottom:1px solid var(--b0);
  display:none;
}
.search-panel.open{display:block}

.search-bar{
  display:flex;align-items:center;gap:10px;
  padding:10px 16px;
  border-bottom:1px solid var(--b0);
}
.search-bar-ico{color:var(--tx3);flex-shrink:0;display:flex}
.search-input{
  flex:1;border:none;outline:none;background:none;
  font-family:var(--fs);font-size:.9rem;color:var(--tx);
  caret-color:var(--acc);
}
.search-input::placeholder{color:var(--tx3)}
.search-clear{
  width:26px;height:26px;border-radius:50%;border:none;
  background:var(--s2);
  display:flex;align-items:center;justify-content:center;
  cursor:pointer;color:var(--tx3);flex-shrink:0;
  opacity:0;pointer-events:none;transition:opacity .12s;
}
.search-clear.visible{opacity:1;pointer-events:auto}
.search-clear:active{background:var(--b0)}

.search-results{max-height:52vh;overflow-y:auto;-webkit-overflow-scrolling:touch}

.search-result-item{
  display:block;padding:12px 16px;
  text-decoration:none;color:inherit;
  border-bottom:1px solid var(--b0);
  transition:background .1s;cursor:pointer;
}
.search-result-item:last-child{border-bottom:none}
.search-result-item:active{background:var(--s2)}
.sri-title{
  font-family:var(--fd);font-weight:800;font-size:.85rem;
  color:var(--tx);margin-bottom:3px;
}
.sri-snippet{
  font-size:.75rem;color:var(--tx3);line-height:1.5;
  overflow:hidden;display:-webkit-box;
  -webkit-line-clamp:2;-webkit-box-orient:vertical;
}
.sri-snippet mark,.sri-title mark{
  background:var(--accd);color:var(--acc);
  border-radius:3px;padding:0 2px;font-weight:600;font-style:normal;
}
.search-status{
  padding:22px 16px;text-align:center;
  font-size:.82rem;color:var(--tx3);line-height:1.5;
}

/* ── SCROLL AREA — flex:1 толкает футер вниз, скролл по всей странице ── */
.scroll{flex:1}

/* ── MAIN CONTENT ── */
.content{
  padding:20px;
}

/* ── FOOTER — скроллится вместе со страницей ── */
.footer{
  background:var(--s1);
  border-top:1px solid var(--b0);
}

/* ── DIVIDER ── */
.divider{height:1px;background:var(--b0);margin:0 20px}

/* ── CONTACTS ── */
.contacts{padding:3px 0}
.contact-item{
  display:flex;align-items:center;gap:12px;
  padding:9px 20px;
  text-decoration:none;color:inherit;
  transition:background .1s;
}
.contact-item.clickable{cursor:pointer}
.contact-item.clickable:active{background:var(--s2)}
.ci-icon{
  width:28px;height:28px;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;
  color:var(--tx3);
}
.ci-body{flex:1;min-width:0}
.ci-val{font-family:var(--fd);font-size:.8rem;font-weight:700;color:var(--tx2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ci-sub{font-family:var(--fd);font-size:.55rem;font-weight:700;letter-spacing:.03em;color:var(--tx3);margin-top:1px}
.ci-arrow{color:var(--txd);flex-shrink:0}

/* ── SOCIALS ── */
.socials-wrap{padding:8px 20px calc(10px + var(--safe-b))}
.socials{display:flex;gap:9px}
.soc-btn{
  width:42px;height:42px;border-radius:11px;
  display:flex;align-items:center;justify-content:center;
  color:#fff;cursor:pointer;
  transition:opacity .12s,transform .12s;
  flex-shrink:0;
}
.soc-btn:active{opacity:.7;transform:scale(.93)}
.soc-btn.fb{background:#1877f2}
.soc-btn.ig{background:linear-gradient(135deg,#f09433,#e6683c,#dc2743,#cc2366,#bc1888)}
.soc-btn.tg{background:#2aabee}
.soc-btn.yt{background:#ff0000}

/* ══════════════════════════════════════
   PROFILE MODAL (bottom sheet)
══════════════════════════════════════ */
.overlay{
  position:fixed;inset:0;z-index:500;
  background:rgba(0,0,0,.38);
  display:flex;align-items:flex-end;
  opacity:0;pointer-events:none;
  transition:opacity .22s;
  backdrop-filter:blur(3px);
  -webkit-backdrop-filter:blur(3px);
}
.overlay.open{opacity:1;pointer-events:auto}

.sheet{
  width:100%;
  background:var(--s1);
  border-radius:22px 22px 0 0;
  padding-bottom:calc(20px + var(--safe-b));
  transform:translateY(100%);
  transition:transform .3s var(--ease);
  overflow:hidden;
}
.overlay.open .sheet{transform:translateY(0)}

.sheet-handle{
  width:38px;height:4px;border-radius:2px;
  background:var(--b1);
  margin:12px auto 0;
}
.sheet-head{
  display:flex;align-items:center;gap:14px;
  padding:18px 20px 14px;
  border-bottom:1px solid var(--b0);
}
.sheet-ava{
  width:52px;height:52px;border-radius:50%;flex-shrink:0;
  background:var(--accd);
  border:2px solid var(--accg);
  display:flex;align-items:center;justify-content:center;
  font-family:var(--fd);font-weight:900;font-size:1.3rem;
  color:var(--acc);
}
.sheet-info{}
.sheet-name{font-family:var(--fd);font-weight:900;font-size:1.05rem;color:var(--tx);line-height:1.2}
.sheet-phone{font-size:.75rem;color:var(--tx3);margin-top:4px;font-weight:500;letter-spacing:.02em}

.sheet-row{
  display:flex;align-items:center;gap:13px;
  padding:13px 20px;
  border-bottom:1px solid var(--b0);
  cursor:pointer;transition:background .1s;
  text-decoration:none;color:inherit;
}
.sheet-row:active{background:var(--s2)}
.sheet-row-ico{
  width:32px;height:32px;border-radius:10px;
  background:var(--s2);
  display:flex;align-items:center;justify-content:center;
  color:var(--tx3);flex-shrink:0;
}
.sheet-row-lbl{flex:1;font-size:.84rem;font-weight:600;color:var(--tx2)}
.sheet-row-arr{color:var(--txd)}

.sheet-logout{
  margin:14px 20px 0;
  width:calc(100% - 40px);
  padding:14px;border:none;border-radius:13px;
  background:rgba(220,38,38,.07);
  color:#dc2626;
  font-family:var(--fd);font-weight:900;font-size:.8rem;
  letter-spacing:.07em;text-transform:uppercase;
  cursor:pointer;
  display:flex;align-items:center;justify-content:center;gap:8px;
  transition:background .12s;
}
.sheet-logout:active{background:rgba(220,38,38,.15)}

/* ══════════════════════════════════════
   НОВОСТИ — контентные стили
══════════════════════════════════════ */
.news-loading{display:flex;align-items:center;justify-content:center;gap:10px;padding:60px 0;color:var(--tx3);font-size:.82rem}
.news-spinner{width:18px;height:18px;border-radius:50%;border:2px solid var(--accg);border-top-color:var(--acc);animation:spin .7s linear infinite;flex-shrink:0}
@keyframes spin{to{transform:rotate(360deg)}}
.news-empty{display:flex;flex-direction:column;align-items:center;padding:60px 0;gap:12px;color:var(--tx3);text-align:center}
.news-empty svg{opacity:.2}
.news-empty-txt{font-size:.85rem;font-weight:600;color:var(--tx3)}
.news-empty-sub{font-size:.74rem;color:var(--txd)}

/* Герой */
.news-hero{display:block;border-radius:16px;overflow:hidden;background:var(--s1);border:1px solid var(--b0);margin-bottom:14px;cursor:pointer;transition:transform .18s var(--ease);-webkit-tap-highlight-color:transparent}
.news-hero:active{transform:scale(.98)}
.news-hero-img{width:100%;aspect-ratio:16/9;object-fit:cover;display:block;background:var(--s2)}
.news-hero-img-ph{width:100%;aspect-ratio:16/9;background:linear-gradient(135deg,var(--s2),var(--accd));display:flex;align-items:center;justify-content:center;color:var(--txd)}
.news-hero-body{padding:14px 16px 16px}
.news-cat{font-size:.58rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--acc);margin-bottom:8px}
.news-hero-title{font-family:var(--fd);font-weight:700;font-size:1rem;line-height:1.32;color:var(--tx);margin-bottom:6px}
.news-hero-sub{font-size:.78rem;color:var(--tx3);line-height:1.55;margin-bottom:10px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.news-meta{display:flex;align-items:center;gap:10px;font-size:.66rem;color:var(--txd);flex-wrap:wrap}
.news-meta-item{display:flex;align-items:center;gap:4px}

/* Список */
.news-list{display:flex;flex-direction:column;border-radius:14px;overflow:hidden;border:1px solid var(--b0)}
.news-card{display:flex;align-items:center;gap:12px;padding:12px 14px;background:var(--s1);cursor:pointer;transition:background .12s;border-top:1px solid var(--b0)}
.news-card:first-child{border-top:none}
.news-card:active{background:var(--s2)}
.news-card-thumb{width:64px;height:64px;border-radius:10px;object-fit:cover;flex-shrink:0;background:var(--s2);display:block}
.news-card-thumb-ph{width:64px;height:64px;border-radius:10px;background:var(--accd);flex-shrink:0;display:flex;align-items:center;justify-content:center;color:var(--acc)}
.news-card-body{flex:1;min-width:0}
.news-card-cat{font-size:.54rem;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--acc);margin-bottom:4px}
.news-card-title{font-family:var(--fd);font-weight:700;font-size:.8rem;color:var(--tx);line-height:1.32;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;margin-bottom:5px}
.news-card-meta{font-size:.62rem;color:var(--txd);display:flex;gap:7px;align-items:center}
.news-card-dot{width:3px;height:3px;border-radius:50%;background:var(--txd);flex-shrink:0}
.news-card-arr{color:var(--txd);flex-shrink:0}

.news-section-title{font-family:var(--fd);font-weight:700;font-size:.7rem;color:var(--tx3);letter-spacing:.06em;text-transform:uppercase;margin:16px 0 8px}

/* Статья */
.art-cover{width:100%;aspect-ratio:16/9;object-fit:cover;display:block;background:var(--s2)}
.art-cover-ph{width:100%;aspect-ratio:16/9;background:linear-gradient(135deg,var(--s2),var(--accd));display:flex;align-items:center;justify-content:center;color:var(--txd)}
.art-body{padding:20px 20px 48px}
.art-title{font-family:var(--fd);font-weight:900;font-size:1.2rem;line-height:1.25;color:var(--tx);margin-bottom:8px}
.art-sub{font-size:.86rem;color:var(--tx3);line-height:1.55;margin-bottom:14px}
.art-meta{display:flex;align-items:center;gap:14px;padding:12px 0;border-top:1px solid var(--b0);border-bottom:1px solid var(--b0);margin-bottom:18px;flex-wrap:wrap}
.art-meta-item{display:flex;align-items:center;gap:5px;font-size:.7rem;color:var(--tx3)}
.art-text{font-size:.86rem;line-height:1.75;color:var(--tx2);white-space:pre-wrap;word-break:break-word}
.art-views{display:flex;align-items:center;gap:5px;margin-top:24px;font-size:.7rem;color:var(--txd)}
</style>
</head>
<body>

<!-- ── HEADER — НЕ ТРОГАТЬ (логотип + аватар, одинаковы на всех страницах) ── -->
<div class="header">
  <div class="logo">
    <img src="dastdaroz.png" alt="dastdaroz"/>
  </div>
  <div class="header-right">
    <!-- Кнопка поиска -->
    <button class="search-btn" id="search-btn" aria-label="Поиск">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
        <circle cx="11" cy="11" r="7"/><path d="M21 21l-4.35-4.35"/>
      </svg>
    </button>
    <!-- Кнопка аватарки: если не авторизован → login.html, если да → модалка -->
    <button class="avatar-btn" id="avatar-btn" aria-label="Профиль">
      <!-- Иконка по умолчанию (не авторизован) -->
      <svg id="ava-icon" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/>
        <circle cx="12" cy="7" r="4"/>
      </svg>
      <!-- Инициалы (авторизован) -->
      <span id="ava-initials" style="display:none"></span>
    </button>
  </div>
</div>

<!-- ── SEARCH PANEL — НЕ ТРОГАТЬ ── -->
<div class="search-panel" id="search-panel">
  <div class="search-bar">
    <span class="search-bar-ico">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
        <circle cx="11" cy="11" r="7"/><path d="M21 21l-4.35-4.35"/>
      </svg>
    </span>
    <input class="search-input" id="search-input" type="search"
      placeholder="Поиск..." autocomplete="off" autocorrect="off"
      autocapitalize="off" spellcheck="false"/>
    <button class="search-clear" id="search-clear" aria-label="Очистить">
      <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
        <path d="M18 6L6 18M6 6l12 12"/>
      </svg>
    </button>
  </div>

<script>
// ════════════════════════════════════════════════════════════════
// ПОИСК — НАСТРОЙКА СТРАНИЦ
// Добавляй/убирай страницы в массиве ниже.
// Формат каждой записи: { title: 'Название', path: 'файл.html' }
// ════════════════════════════════════════════════════════════════
const SEARCH_PAGES = [
  // { title: 'Главная',        path: 'index.html'   },
  // { title: 'Каталог',        path: 'catalog.html' },
  // { title: 'О нас',          path: 'about.html'   },
  // { title: 'Заказы',          path: 'orders.html'  },
];
// ════════════════════════════════════════════════════════════════

(function(){
  const searchBtn     = document.getElementById('search-btn');
  const searchPanel   = document.getElementById('search-panel');
  const searchInput   = document.getElementById('search-input');
  const searchClear   = document.getElementById('search-clear');
  const searchResults = document.getElementById('search-results');

  let index    = null;   // null = ещё не загружен
  let loading  = false;
  let timer    = null;

  /* ── Открыть/закрыть ── */
  function open() {
    searchPanel.classList.add('open');
    searchBtn.classList.add('active');
    searchInput.focus();
    if (!index && !loading) buildIndex();
  }
  function close() {
    searchPanel.classList.remove('open');
    searchBtn.classList.remove('active');
    searchInput.value = '';
    searchClear.classList.remove('visible');
    searchResults.innerHTML = '';
  }

  searchBtn.addEventListener('click', () =>
    searchPanel.classList.contains('open') ? close() : open()
  );
  searchClear.addEventListener('click', () => {
    searchInput.value = '';
    searchClear.classList.remove('visible');
    searchResults.innerHTML = '';
    searchInput.focus();
  });
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape' && searchPanel.classList.contains('open')) close();
  });

  /* ── Индексация ── */
  async function buildIndex() {
    if (!SEARCH_PAGES.length) { index = []; return; }
    loading = true;
    searchResults.innerHTML = '<div class="search-status">Загрузка…</div>';
    const parser = new DOMParser();
    index = [];
    await Promise.all(SEARCH_PAGES.map(async page => {
      try {
        const res = await fetch(page.path);
        if (!res.ok) return;
        const html = await res.text();
        const doc  = parser.parseFromString(html, 'text/html');
        const el   = doc.querySelector('.content');
        const text = (el ? el.textContent : '').replace(/\s+/g,' ').trim();
        index.push({ title: page.title, path: page.path, text });
      } catch(e) { /* пропустить недоступные */ }
    }));
    loading = false;
    searchResults.innerHTML = '';
    const q = searchInput.value.trim();
    if (q.length >= 2) doSearch(q);
  }

  /* ── Поиск ── */
  searchInput.addEventListener('input', () => {
    const q = searchInput.value.trim();
    searchClear.classList.toggle('visible', q.length > 0);
    clearTimeout(timer);
    timer = setTimeout(() => doSearch(q), 180);
  });

  function esc(s){ return s.replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
  function hi(text, q){
    return esc(text).replace(
      new RegExp(esc(q).replace(/[.*+?^${}()|[\]\\]/g,'\\$&'),'gi'),
      m => '<mark>'+m+'</mark>'
    );
  }

  function doSearch(q) {
    if (!q || q.length < 2) { searchResults.innerHTML = ''; return; }
    if (loading || !index) {
      searchResults.innerHTML = '<div class="search-status">Загрузка…</div>';
      return;
    }
    if (!index.length) {
      searchResults.innerHTML = '<div class="search-status">Страницы для поиска не добавлены</div>';
      return;
    }

    const low  = q.toLowerCase();
    const hits = [];

    for (const page of index) {
      const ti = page.title.toLowerCase().indexOf(low);
      const tx = page.text.toLowerCase().indexOf(low);
      if (ti === -1 && tx === -1) continue;

      let snippet = '';
      if (tx !== -1) {
        const s = Math.max(0, tx - 45);
        const e = Math.min(page.text.length, tx + q.length + 90);
        snippet = (s > 0 ? '…' : '') + page.text.slice(s, e) + (e < page.text.length ? '…' : '');
      } else {
        snippet = page.text.slice(0, 130) + (page.text.length > 130 ? '…' : '');
      }
      hits.push({ page, snippet });
    }

    if (!hits.length) {
      searchResults.innerHTML = `<div class="search-status">«${esc(q)}» не найдено</div>`;
      return;
    }

    searchResults.innerHTML = hits.map(({page, snippet}) => `
      <a href="${esc(page.path)}" class="search-result-item">
        <div class="sri-title">${hi(page.title, q)}</div>
        <div class="sri-snippet">${hi(snippet, q)}</div>
      </a>
    `).join('');
  }
})();
</script>

<script type="module">
// ═══ НЕ ТРОГАТЬ — Firebase auth логика, одинакова на всех страницах ════════
import { auth } from './firebase.js';
import {
  onAuthStateChanged,
  signOut,
} from 'https://www.gstatic.com/firebasejs/11.8.1/firebase-auth.js';

// ═══ Элементы ════════════════════════════════════════════════════
const avatarBtn   = document.getElementById('avatar-btn');
const avaIcon     = document.getElementById('ava-icon');
const avaInitials = document.getElementById('ava-initials');
const overlay     = document.getElementById('overlay');
const sheetAva    = document.getElementById('sheet-ava');
const sheetName   = document.getElementById('sheet-name');
const sheetPhone  = document.getElementById('sheet-phone');
const btnLogout   = document.getElementById('btn-logout');

let currentUser = null;

// ═══ Хелперы ═════════════════════════════════════════════════════

/** Первые буквы имени: "Фируз Мирзоев" → "ФМ" */
function initials(name) {
  if (!name) return '?';
  const p = name.trim().split(/\s+/);
  return p.length > 1
    ? (p[0][0] + p[1][0]).toUpperCase()
    : p[0][0].toUpperCase();
}

/** email вида 992901234567@phone.dastdaroz.id → "+992 90 123 45 67" */
function emailToPhone(email) {
  if (!email) return '—';
  const m = email.match(/^992(\d{9})@/);
  if (!m) return email;
  const d = m[1];
  return '+992 ' + d.slice(0,2) + ' ' + d.slice(2,5) + ' ' + d.slice(5,7) + ' ' + d.slice(7,9);
}

// ═══ Состояние auth ══════════════════════════════════════════════
onAuthStateChanged(auth, user => {
  currentUser = user;

  if (user) {
    // Авторизован — показываем инициалы на аватарке
    const ini = initials(user.displayName);
    avaIcon.style.display     = 'none';
    avaInitials.style.display = '';
    avaInitials.textContent   = ini;
    avatarBtn.classList.add('authed');

    // Заполняем bottom sheet
    sheetAva.textContent   = ini;
    sheetName.textContent  = user.displayName || 'Пользователь';
    sheetPhone.textContent = emailToPhone(user.email);
  } else {
    // Не авторизован — обычная иконка
    avaIcon.style.display     = '';
    avaInitials.style.display = 'none';
    avatarBtn.classList.remove('authed');
  }
});

// ═══ Клик по аватарке ════════════════════════════════════════════
avatarBtn.addEventListener('click', () => {
  if (currentUser) {
    overlay.classList.add('open');        // показать bottom sheet
  } else {
    window.location.href = 'login.html'; // перейти на логин
  }
});

// ═══ Закрытие sheet по тапу на фон ══════════════════════════════
overlay.addEventListener('click', e => {
  if (e.target === overlay) overlay.classList.remove('open');
});

// ═══ Выход ═══════════════════════════════════════════════════════
btnLogout.addEventListener('click', async () => {
  await signOut(auth);
  overlay.classList.remove('open');
  // currentUser обнулится через onAuthStateChanged автоматически
});
</script>

function cardHtml(a){
  return `<div class="news-card" onclick="openArticle('${a.id}')">
    ${cover(a.coverUrl,'news-card-thumb','news-card-thumb-ph')}
    <div class="news-card-body">
      ${a.category ? `<div class="news-card-cat">${esc(a.category)}</div>` : ''}
      <div class="news-card-title">${esc(a.title)}</div>
      <div class="news-card-meta">
        <span>${fmtDate(a.createdAt)}</span>
        <div class="news-card-dot"></div>
        <span>${a.readingTime||3} мин</span>
      </div>
    </div>
    <svg class="news-card-arr" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 18l6-6-6-6"/></svg>
  </div>`;
}

async function loadNews(){
  try {
    const q    = query(collection(db,'news'), orderBy('createdAt','desc'));
    const snap = await getDocs(q);
    allArticles = snap.docs
      .map(d => ({id:d.id, ...d.data()}))
      .filter(a => a.status === 'published');
    renderNews(allArticles);
  } catch(e) {
    console.error('Ошибка загрузки новостей:', e);
    document.getElementById('news-loading').style.display = 'none';
    document.getElementById('news-empty').style.display   = 'flex';
  }
}

// ── Статья ───────────────────────────────────────────────────────
window.openArticle = function(id){
  const a = allArticles.find(x => x.id === id);
  if (!a) return;

  // Поддержка разных названий поля с текстом статьи
  const bodyText = a.content || a.text || a.body || a.description || '';

  try {
    const coverHtml  = cover(a.coverUrl,'art-cover','art-cover-ph');
    const catHtml    = a.category ? `<div class="news-cat">${esc(a.category)}</div>` : '';
    const subHtml    = a.subtitle  ? `<div class="art-sub">${esc(a.subtitle)}</div>`  : '';
    const dateStr    = fmtDate(a.createdAt);
    const viewsCount = (a.views||0) + 1;
    const textHtml   = bodyText
      ? `<div class="art-text">${esc(bodyText)}</div>`
      : `<div class="art-text" style="color:var(--txd);font-style:italic;font-size:.8rem">Текст статьи не добавлен</div>`;

    const html = coverHtml
      + '<div class="art-body">'
      +   catHtml
      +   `<div class="art-title">${esc(a.title)}</div>`
      +   subHtml
      +   '<div class="art-meta">'
      +     `<div class="art-meta-item"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>${esc(a.author||'Редакция')}</div>`
      +     `<div class="art-meta-item"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>${a.readingTime||3} мин</div>`
      +   (dateStr ? `<div class="art-meta-item"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>${dateStr}</div>` : '')
      +   '</div>'
      +   textHtml
      +   `<div class="art-views"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>${viewsCount} прочитали</div>`
      + '</div>';

    Sheet.body('article').innerHTML = html;
  } catch(err) {
    console.error('openArticle render error:', err);
    Sheet.body('article').innerHTML =
      '<div class="art-body"><div class="art-title">' + esc(a.title||'') + '</div>'
      + '<p style="color:var(--tx3);font-size:.82rem;margin-top:12px">Не удалось отобразить статью</p></div>';
  }

  Sheet.setTitle('article', a.title || 'Статья');
  Sheet.body('article').scrollTop = 0;
  Sheet.open('article');

  updateDoc(doc(db,'news',id), {views:increment(1), updatedAt:serverTimestamp()}).catch(()=>{});
};

document.addEventListener('keydown', e => { if (e.key === 'Escape') Sheet.close('article'); });

loadNews();
</script>

</body>
</html>
