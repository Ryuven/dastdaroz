<!--
╔══════════════════════════════════════════════════════════════════╗
║              ШАБЛОН DASTDAROZ — ПРАВИЛА ДЛЯ ИИ                  ║
╠══════════════════════════════════════════════════════════════════╣
║                                                                  ║
║  ЕДИНСТВЕННАЯ ЗОНА РЕДАКТИРОВАНИЯ:                               ║
║  Блок между метками КОНТЕНТ START и КОНТЕНТ END внутри .content  ║
║                                                                  ║
║  ЧТО ЗАПРЕЩЕНО ТРОГАТЬ:                                          ║
║  ✗  <div class="header"> ... </div>   — топ-бар с логотипом     ║
║  ✗  <div class="footer"> ... </div>   — контакты и соцсети      ║
║  ✗  <div class="overlay"> ... </div>  — профиль bottom sheet     ║
║  ✗  <style> ... </style>              — все CSS переменные       ║
║  ✗  <script> ... </script>            — Firebase auth логика     ║
║                                                                  ║
║  ЧТО РАЗРЕШЕНО:                                                  ║
║  ✓  Заменить содержимое между КОНТЕНТ START / КОНТЕНТ END        ║
║  ✓  Добавлять новые CSS-классы в <style> для контента страницы   ║
║                                                                  ║
╚══════════════════════════════════════════════════════════════════╝
-->
<html lang="tg">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover"/>
<meta name="mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<title>Навигация · dastdaroz</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800;900&family=Inter:wght@400;500;600;700&display=swap"/>
<style>
:root{
  --acc:#1a9e4a;--acc2:#22c55e;--accd:rgba(26,158,74,.09);--accg:rgba(26,158,74,.2);
  --bg:#f3f7f4;--s1:#ffffff;--s2:#edf4ef;
  --b0:rgba(0,0,0,.07);--b1:rgba(0,0,0,.15);
  --tx:#171f1a;--tx2:#3d5244;--tx3:#7a9882;--txd:#b0c4b8;
  --fd:'Nunito',sans-serif;--fs:'Inter',system-ui,sans-serif;
  --safe-t:env(safe-area-inset-top,0px);
  --safe-b:env(safe-area-inset-bottom,0px);
  --ease:cubic-bezier(.32,0,.18,1);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;-webkit-text-size-adjust:100%}
body{
  background:var(--bg);color:var(--tx);
  font-family:var(--fs);
  height:100svh;max-height:100svh;
  overflow:hidden;
  display:flex;flex-direction:column;
  padding-top:var(--safe-t);
  -webkit-font-smoothing:antialiased;
}
a{color:inherit;text-decoration:none}

/* ── HEADER ── */
.header{
  flex-shrink:0;
  display:flex;align-items:center;justify-content:space-between;
  padding:0 20px;
  height:54px;
  border-bottom:1px solid var(--b0);
  background:var(--s1);
  z-index:100;
}
.logo{display:flex;align-items:center;height:100%}
.logo img{height:28px;width:auto;object-fit:contain;display:block}
.header-right{display:flex;align-items:center;gap:10px}

/* ── AVATAR BUTTON ── */
.avatar-btn{
  width:36px;height:36px;border-radius:50%;flex-shrink:0;
  background:var(--s2);border:2px solid var(--b0);
  display:flex;align-items:center;justify-content:center;
  cursor:pointer;outline:none;
  transition:border-color .15s,background .15s;
  color:var(--tx3);
  font-family:var(--fd);font-weight:900;font-size:.75rem;
}
.avatar-btn:active{background:var(--accd);border-color:var(--acc)}
.avatar-btn.authed{background:var(--accd);border-color:var(--accg);color:var(--acc)}

/* ── SCROLL AREA ── */
.scroll{flex:1;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch}

/* ── MAIN CONTENT ── */
.content{padding:20px}

/* ── FOOTER ── */
.footer{flex-shrink:0;background:var(--s1);border-top:1px solid var(--b0)}
.divider{height:1px;background:var(--b0);margin:0 20px}
.contacts{padding:3px 0}
.contact-item{display:flex;align-items:center;gap:12px;padding:9px 20px;text-decoration:none;color:inherit;transition:background .1s}
.contact-item.clickable{cursor:pointer}
.contact-item.clickable:active{background:var(--s2)}
.ci-icon{width:28px;height:28px;flex-shrink:0;display:flex;align-items:center;justify-content:center;color:var(--tx3)}
.ci-body{flex:1;min-width:0}
.ci-val{font-size:.8rem;font-weight:600;color:var(--tx2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ci-sub{font-size:.58rem;color:var(--tx3);margin-top:1px}
.ci-arrow{color:var(--txd);flex-shrink:0}
.socials-wrap{padding:8px 20px calc(10px + var(--safe-b))}
.socials{display:flex;gap:9px}
.soc-btn{width:42px;height:42px;border-radius:11px;display:flex;align-items:center;justify-content:center;color:#fff;cursor:pointer;transition:opacity .12s,transform .12s;flex-shrink:0}
.soc-btn:active{opacity:.7;transform:scale(.93)}
.soc-btn.fb{background:#1877f2}
.soc-btn.ig{background:linear-gradient(135deg,#f09433,#e6683c,#dc2743,#cc2366,#bc1888)}
.soc-btn.tg{background:#2aabee}
.soc-btn.yt{background:#ff0000}

/* ── PROFILE SHEET ── */
.overlay{position:fixed;inset:0;z-index:500;background:rgba(0,0,0,.38);display:flex;align-items:flex-end;opacity:0;pointer-events:none;transition:opacity .22s;backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px)}
.overlay.open{opacity:1;pointer-events:auto}
.sheet{width:100%;background:var(--s1);border-radius:22px 22px 0 0;padding-bottom:calc(20px + var(--safe-b));transform:translateY(100%);transition:transform .3s var(--ease);overflow:hidden}
.overlay.open .sheet{transform:translateY(0)}
.sheet-handle{width:38px;height:4px;border-radius:2px;background:var(--b1);margin:12px auto 0}
.sheet-head{display:flex;align-items:center;gap:14px;padding:18px 20px 14px;border-bottom:1px solid var(--b0)}
.sheet-ava{width:52px;height:52px;border-radius:50%;flex-shrink:0;background:var(--accd);border:2px solid var(--accg);display:flex;align-items:center;justify-content:center;font-family:var(--fd);font-weight:900;font-size:1.3rem;color:var(--acc)}
.sheet-name{font-family:var(--fd);font-weight:900;font-size:1.05rem;color:var(--tx);line-height:1.2}
.sheet-phone{font-size:.75rem;color:var(--tx3);margin-top:4px;font-weight:500;letter-spacing:.02em}
.sheet-row{display:flex;align-items:center;gap:13px;padding:13px 20px;border-bottom:1px solid var(--b0);cursor:pointer;transition:background .1s;text-decoration:none;color:inherit}
.sheet-row:active{background:var(--s2)}
.sheet-row-ico{width:32px;height:32px;border-radius:10px;background:var(--s2);display:flex;align-items:center;justify-content:center;color:var(--tx3);flex-shrink:0}
.sheet-row-lbl{flex:1;font-size:.84rem;font-weight:600;color:var(--tx2)}
.sheet-row-arr{color:var(--txd)}
.sheet-logout{margin:14px 20px 0;width:calc(100% - 40px);padding:14px;border:none;border-radius:13px;background:rgba(220,38,38,.07);color:#dc2626;font-family:var(--fd);font-weight:900;font-size:.8rem;letter-spacing:.07em;text-transform:uppercase;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;transition:background .12s}
.sheet-logout:active{background:rgba(220,38,38,.15)}

/* ══════════════════════════════════════
   КОНТЕНТ — стили новостей
══════════════════════════════════════ */

/* Состояния загрузки и пустого списка */
.news-loading{
  display:flex;align-items:center;justify-content:center;
  gap:10px;padding:48px 20px;
  color:var(--tx3);font-size:.85rem;
}
.news-spinner{
  width:18px;height:18px;border-radius:50%;
  border:2px solid var(--accg);
  border-top-color:var(--acc);
  animation:spin .7s linear infinite;
  flex-shrink:0;
}
@keyframes spin{to{transform:rotate(360deg)}}

.news-empty{
  display:flex;flex-direction:column;align-items:center;
  padding:52px 20px;gap:10px;color:var(--tx3);
  text-align:center;
}
.news-empty svg{opacity:.25}
.news-empty-txt{font-size:.85rem;font-weight:500}

/* Герой — первая статья */
.news-hero{
  display:block;
  border-radius:16px;
  overflow:hidden;
  background:var(--s1);
  border:1px solid var(--b0);
  margin-bottom:16px;
  cursor:pointer;
  transition:transform .18s var(--ease),box-shadow .18s;
  -webkit-tap-highlight-color:transparent;
}
.news-hero:active{transform:scale(.985)}
.news-hero-img{
  width:100%;aspect-ratio:16/9;
  object-fit:cover;display:block;
  background:var(--s2);
}
.news-hero-img-ph{
  width:100%;aspect-ratio:16/9;
  background:linear-gradient(135deg,var(--s2),var(--accd));
  display:flex;align-items:center;justify-content:center;
  color:var(--txd);
}
.news-hero-body{padding:14px 16px 16px}
.news-hero-cat{
  display:inline-flex;align-items:center;
  font-size:.6rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;
  color:var(--acc);background:var(--accd);
  padding:3px 9px;border-radius:99px;
  margin-bottom:8px;
}
.news-hero-title{
  font-family:var(--fd);font-weight:900;
  font-size:1.15rem;line-height:1.3;
  color:var(--tx);margin-bottom:6px;
}
.news-hero-sub{
  font-size:.8rem;color:var(--tx3);
  line-height:1.5;margin-bottom:10px;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
}
.news-hero-meta{
  display:flex;align-items:center;gap:12px;
  font-size:.68rem;color:var(--txd);
}
.news-hero-meta span{display:flex;align-items:center;gap:4px}

/* Список карточек */
.news-list{display:flex;flex-direction:column;gap:1px;background:var(--b0);border-radius:14px;overflow:hidden;border:1px solid var(--b0)}

.news-card{
  display:flex;align-items:center;gap:12px;
  padding:13px 14px;
  background:var(--s1);
  cursor:pointer;
  transition:background .12s;
  text-decoration:none;color:inherit;
}
.news-card:active{background:var(--s2)}

.news-card-thumb{
  width:64px;height:64px;border-radius:10px;
  object-fit:cover;flex-shrink:0;
  background:var(--s2);display:block;
}
.news-card-thumb-ph{
  width:64px;height:64px;border-radius:10px;
  background:var(--accd);flex-shrink:0;
  display:flex;align-items:center;justify-content:center;
  color:var(--acc2);
}
.news-card-body{flex:1;min-width:0}
.news-card-cat{
  font-size:.56rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;
  color:var(--acc);margin-bottom:4px;
}
.news-card-title{
  font-family:var(--fd);font-weight:800;font-size:.88rem;
  color:var(--tx);line-height:1.3;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
  margin-bottom:5px;
}
.news-card-meta{font-size:.63rem;color:var(--txd);display:flex;gap:8px;align-items:center}
.news-card-dot{width:3px;height:3px;border-radius:50%;background:var(--txd);flex-shrink:0}

/* Стрелка */
.news-card-arr{color:var(--txd);flex-shrink:0}

/* Детальный просмотр статьи (bottom sheet) */
.article-overlay{
  position:fixed;inset:0;z-index:400;
  background:rgba(0,0,0,.45);
  display:flex;align-items:flex-end;
  opacity:0;pointer-events:none;
  transition:opacity .25s;
}
.article-overlay.open{opacity:1;pointer-events:auto}
.article-sheet{
  width:100%;height:92svh;
  background:var(--bg);
  border-radius:22px 22px 0 0;
  display:flex;flex-direction:column;
  transform:translateY(100%);
  transition:transform .32s var(--ease);
  overflow:hidden;
}
.article-overlay.open .article-sheet{transform:translateY(0)}

.article-handle{width:38px;height:4px;border-radius:2px;background:var(--b1);margin:12px auto 6px;flex-shrink:0}

.article-scroll{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch}

.article-cover{
  width:100%;aspect-ratio:16/9;object-fit:cover;display:block;
  background:var(--s2);
}
.article-cover-ph{
  width:100%;aspect-ratio:16/9;
  background:linear-gradient(135deg,var(--s2),var(--accd));
  display:flex;align-items:center;justify-content:center;
  color:var(--txd);
}

.article-body{padding:20px 20px 32px}
.article-cat{
  display:inline-flex;
  font-size:.6rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;
  color:var(--acc);background:var(--accd);
  padding:3px 9px;border-radius:99px;margin-bottom:10px;
}
.article-title{
  font-family:var(--fd);font-weight:900;font-size:1.3rem;
  line-height:1.25;color:var(--tx);margin-bottom:8px;
}
.article-sub{
  font-size:.88rem;color:var(--tx3);line-height:1.55;margin-bottom:14px;
}
.article-meta{
  display:flex;align-items:center;gap:14px;
  padding:12px 0;border-top:1px solid var(--b0);border-bottom:1px solid var(--b0);
  margin-bottom:18px;
}
.article-meta-item{display:flex;align-items:center;gap:5px;font-size:.7rem;color:var(--tx3)}
.article-content{
  font-size:.88rem;line-height:1.7;color:var(--tx2);
  white-space:pre-wrap;word-break:break-word;
}
.article-views{
  display:flex;align-items:center;gap:5px;
  margin-top:20px;font-size:.72rem;color:var(--txd);
}
</style>
</head>

    </div>

</div>

<div class="article-overlay" id="article-overlay">
  <div class="article-sheet">
    <div class="article-handle"></div>
    <div class="article-scroll" id="article-scroll">
      <div id="article-inner"></div>
    </div>
  </div>
</div>

<!-- ── PROFILE BOTTOM SHEET — НЕ ТРОГАТЬ ── -->
<div class="overlay" id="overlay">
  <div class="sheet" id="sheet">
    <div class="sheet-handle"></div>
    <div class="sheet-head">
      <div class="sheet-ava" id="sheet-ava">?</div>
      <div class="sheet-info">
        <div class="sheet-name" id="sheet-name">—</div>
        <div class="sheet-phone" id="sheet-phone">—</div>
      </div>
    </div>
    <div class="sheet-row" onclick="window.location.href='orders.html'">
      <div class="sheet-row-ico">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 2L3 6v14a2 2 0 002 2h14a2 2 0 002-2V6l-3-4z"/><line x1="3" y1="6" x2="21" y2="6"/><path d="M16 10a4 4 0 01-8 0"/></svg>
      </div>
      <span class="sheet-row-lbl">Фармоишҳои ман</span>
      <svg class="sheet-row-arr" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 18l6-6-6-6"/></svg>
    </div>
    <button class="sheet-logout" id="btn-logout">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
      Хуруҷ
    </button>
  </div>
</div>

<script type="module">
// ═══ НЕ ТРОГАТЬ — Firebase auth ══════════════════════════════
import { initializeApp } from 'https://www.gstatic.com/firebasejs/11.8.1/firebase-app.js';
import { getAuth, onAuthStateChanged, signOut } from 'https://www.gstatic.com/firebasejs/11.8.1/firebase-auth.js';
import { getFirestore, collection, query, where, orderBy, getDocs, doc, updateDoc, increment, serverTimestamp } from 'https://www.gstatic.com/firebasejs/11.8.1/firebase-firestore.js';

const cfg={apiKey:'AIzaSyCjIAMFuwLKwmjChCuiz-MHLv5WZOczAAE',authDomain:'delivery-galelium.firebaseapp.com',projectId:'delivery-galelium',storageBucket:'delivery-galelium.firebasestorage.app',messagingSenderId:'982466555080',appId:'1:982466555080:web:c77ccbff0e71e540ddc9fd'};
const app = initializeApp(cfg);
const auth = getAuth(app);
const db   = getFirestore(app);

// Auth UI
const avatarBtn   = document.getElementById('avatar-btn');
const avaIcon     = document.getElementById('ava-icon');
const avaInitials = document.getElementById('ava-initials');
const overlay     = document.getElementById('overlay');
const sheetAva    = document.getElementById('sheet-ava');
const sheetName   = document.getElementById('sheet-name');
const sheetPhone  = document.getElementById('sheet-phone');
const btnLogout   = document.getElementById('btn-logout');
let currentUser = null;

function initials(name){if(!name)return'?';const p=name.trim().split(/\s+/);return p.length>1?(p[0][0]+p[1][0]).toUpperCase():p[0][0].toUpperCase();}
function emailToPhone(email){if(!email)return'—';const m=email.match(/^992(\d{9})@/);if(!m)return email;const d=m[1];return'+992 '+d.slice(0,2)+' '+d.slice(2,5)+' '+d.slice(5,7)+' '+d.slice(7,9);}

onAuthStateChanged(auth, user=>{
  currentUser=user;
  if(user){
    const ini=initials(user.displayName);
    avaIcon.style.display='none';avaInitials.style.display='';avaInitials.textContent=ini;
    avatarBtn.classList.add('authed');
    sheetAva.textContent=ini;sheetName.textContent=user.displayName||'Корбар';sheetPhone.textContent=emailToPhone(user.email);
  }else{
    avaIcon.style.display='';avaInitials.style.display='none';avatarBtn.classList.remove('authed');
  }
});
avatarBtn.addEventListener('click',()=>{if(currentUser)overlay.classList.add('open');else window.location.href='login.html';});
overlay.addEventListener('click',e=>{if(e.target===overlay)overlay.classList.remove('open');});
btnLogout.addEventListener('click',async()=>{await signOut(auth);overlay.classList.remove('open');});

// ═══ НОВОСТИ — загрузка и рендер ════════════════════════════

function esc(s){return(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}

function fmtDate(ts){
  if(!ts?.toDate)return'';
  return ts.toDate().toLocaleDateString('tg-TJ',{day:'numeric',month:'long'});
}

function coverHtml(url, cls, phCls){
  if(url) return `<img class="${cls}" src="${esc(url)}" alt="" onerror="this.style.display='none'">`;
  return `<div class="${phCls}"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.3"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg></div>`;
}

async function loadNews(){
  const loading  = document.getElementById('news-loading');
  const heroWrap = document.getElementById('news-hero-wrap');
  const newsList = document.getElementById('news-list');
  const empty    = document.getElementById('news-empty');

  try{
    const q = query(
      collection(db,'news'),
      where('status','==','published'),
      orderBy('createdAt','desc')
    );
    const snap = await getDocs(q);
    const articles = snap.docs.map(d=>({id:d.id,...d.data()}));

    loading.style.display='none';

    if(!articles.length){empty.style.display='flex';return;}

    // Герой — первая статья
    const hero = articles[0];
    heroWrap.style.display='block';
    heroWrap.innerHTML=`
      <div class="news-hero" onclick="openArticle('${hero.id}')">
        ${coverHtml(hero.coverUrl,'news-hero-img','news-hero-img-ph')}
        <div class="news-hero-body">
          ${hero.category?`<div class="news-hero-cat">${esc(hero.category)}</div>`:''}
          <div class="news-hero-title">${esc(hero.title)}</div>
          ${hero.subtitle?`<div class="news-hero-sub">${esc(hero.subtitle)}</div>`:''}
          <div class="news-hero-meta">
            <span>
              <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
              ${hero.readingTime||3} дақ
            </span>
            <span>${fmtDate(hero.createdAt)}</span>
            ${hero.views?`<span><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>${hero.views}</span>`:''}
          </div>
        </div>
      </div>`;

    // Остальные статьи
    if(articles.length > 1){
      newsList.style.display='flex';
      newsList.innerHTML = articles.slice(1).map(a=>`
        <div class="news-card" onclick="openArticle('${a.id}')">
          ${coverHtml(a.coverUrl,'news-card-thumb','news-card-thumb-ph')}
          <div class="news-card-body">
            ${a.category?`<div class="news-card-cat">${esc(a.category)}</div>`:''}
            <div class="news-card-title">${esc(a.title)}</div>
            <div class="news-card-meta">
              <span>${fmtDate(a.createdAt)}</span>
              <div class="news-card-dot"></div>
              <span>${a.readingTime||3} дақ</span>
            </div>
          </div>
          <svg class="news-card-arr" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 18l6-6-6-6"/></svg>
        </div>`).join('');
    }

  }catch(e){
    loading.style.display='none';
    empty.style.display='flex';
    console.error('News load error:',e);
  }
}

// Открытие статьи
const artOverlay = document.getElementById('article-overlay');
const artInner   = document.getElementById('article-scroll');
let articlesCache = {};

window.openArticle = async function(id){
  // Найти в уже загруженном
  let a = articlesCache[id];
  if(!a){
    // Ищем в DOM — данные уже есть в памяти через loadNews
    // Для упрощения — перезагружаем из Firestore
    const {getDoc} = await import('https://www.gstatic.com/firebasejs/11.8.1/firebase-firestore.js');
    const snap = await getDoc(doc(db,'news',id));
    if(!snap.exists())return;
    a = {id:snap.id,...snap.data()};
    articlesCache[id]=a;
  }

  document.getElementById('article-inner').innerHTML=`
    ${coverHtml(a.coverUrl,'article-cover','article-cover-ph')}
    <div class="article-body">
      ${a.category?`<div class="article-cat">${esc(a.category)}</div>`:''}
      <div class="article-title">${esc(a.title)}</div>
      ${a.subtitle?`<div class="article-sub">${esc(a.subtitle)}</div>`:''}
      <div class="article-meta">
        <div class="article-meta-item">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
          ${esc(a.author||'Редакция')}
        </div>
        <div class="article-meta-item">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
          ${a.readingTime||3} дақ
        </div>
        <div class="article-meta-item">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
          ${fmtDate(a.createdAt)}
        </div>
      </div>
      <div class="article-content">${esc(a.content)}</div>
      ${a.views!=null?`<div class="article-views"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>${(a.views||0)+1} кас хонд</div>`:''}
    </div>`;

  artOverlay.classList.add('open');
  document.getElementById('article-scroll').scrollTop=0;

  // Инкремент просмотров
  updateDoc(doc(db,'news',id),{views:increment(1),updatedAt:serverTimestamp()}).catch(()=>{});
};

artOverlay.addEventListener('click', e=>{
  if(e.target===artOverlay) artOverlay.classList.remove('open');
});

loadNews();
</script>

</body>
</html>
