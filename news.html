<!DOCTYPE html>
<html lang="tg">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover"/>
<meta name="mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<title>Хабарҳо · dastdaroz</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800;900&family=Inter:wght@400;500;600;700&display=swap"/>
<style>
:root{
  --acc:#1a9e4a;--acc2:#22c55e;--accd:rgba(26,158,74,.09);--accg:rgba(26,158,74,.2);
  --bg:#f3f7f4;--s1:#ffffff;--s2:#edf4ef;
  --b0:rgba(0,0,0,.07);--b1:rgba(0,0,0,.15);
  --tx:#171f1a;--tx2:#3d5244;--tx3:#7a9882;--txd:#b0c4b8;
  --fd:'Nunito',sans-serif;--fs:'Inter',system-ui,sans-serif;
  --safe-t:env(safe-area-inset-top,0px);
  --safe-b:env(safe-area-inset-bottom,0px);
  --ease:cubic-bezier(.32,0,.18,1);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;-webkit-text-size-adjust:100%}
body{
  background:var(--bg);color:var(--tx);
  font-family:var(--fs);
  height:100svh;max-height:100svh;
  overflow:hidden;
  display:flex;flex-direction:column;
  padding-top:var(--safe-t);
  -webkit-font-smoothing:antialiased;
}
a{color:inherit;text-decoration:none}

/* ── HEADER ── */
.header{
  flex-shrink:0;
  display:flex;align-items:center;justify-content:space-between;
  padding:0 20px;height:54px;
  border-bottom:1px solid var(--b0);
  background:var(--s1);z-index:100;
}
.logo{display:flex;align-items:center;height:100%}
.logo img{height:28px;width:auto;object-fit:contain;display:block}
.header-right{display:flex;align-items:center;gap:10px}
.avatar-btn{
  width:36px;height:36px;border-radius:50%;flex-shrink:0;
  background:var(--s2);border:2px solid var(--b0);
  display:flex;align-items:center;justify-content:center;
  cursor:pointer;outline:none;
  transition:border-color .15s,background .15s;
  color:var(--tx3);font-family:var(--fd);font-weight:900;font-size:.75rem;
}
.avatar-btn:active{background:var(--accd);border-color:var(--acc)}
.avatar-btn.authed{background:var(--accd);border-color:var(--accg);color:var(--acc)}
.search-btn{
  width:36px;height:36px;border-radius:50%;flex-shrink:0;
  background:none;border:none;
  display:flex;align-items:center;justify-content:center;
  cursor:pointer;color:var(--tx3);
  transition:background .15s;
}
.search-btn:active{background:var(--s2)}

/* ── SCROLL ── */
.scroll{flex:1;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch}

/* ── CONTENT ── */
.content{padding:20px}

/* ── FOOTER — flex-shrink:0, всегда НИЖЕ скролла ── */
.footer{flex-shrink:0;background:var(--s1);border-top:1px solid var(--b0)}
.divider{height:1px;background:var(--b0);margin:0 20px}
.contacts{padding:3px 0}
.contact-item{display:flex;align-items:center;gap:12px;padding:9px 20px;text-decoration:none;color:inherit;transition:background .1s}
.contact-item.clickable{cursor:pointer}
.contact-item.clickable:active{background:var(--s2)}
.ci-icon{width:28px;height:28px;flex-shrink:0;display:flex;align-items:center;justify-content:center;color:var(--tx3)}
.ci-body{flex:1;min-width:0}
.ci-val{font-size:.8rem;font-weight:600;color:var(--tx2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ci-sub{font-size:.58rem;color:var(--tx3);margin-top:1px}
.ci-arrow{color:var(--txd);flex-shrink:0}
.socials-wrap{padding:8px 20px calc(10px + var(--safe-b))}
.socials{display:flex;gap:9px}
.soc-btn{width:42px;height:42px;border-radius:11px;display:flex;align-items:center;justify-content:center;color:#fff;cursor:pointer;transition:opacity .12s,transform .12s;flex-shrink:0}
.soc-btn:active{opacity:.7;transform:scale(.93)}
.soc-btn.fb{background:#1877f2}
.soc-btn.ig{background:linear-gradient(135deg,#f09433,#e6683c,#dc2743,#cc2366,#bc1888)}
.soc-btn.tg{background:#2aabee}
.soc-btn.yt{background:#ff0000}

/* ── PROFILE SHEET ── */
.overlay{position:fixed;inset:0;z-index:500;background:rgba(0,0,0,.38);display:flex;align-items:flex-end;opacity:0;pointer-events:none;transition:opacity .22s;backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px)}
.overlay.open{opacity:1;pointer-events:auto}
.sheet{width:100%;background:var(--s1);border-radius:22px 22px 0 0;padding-bottom:calc(20px + var(--safe-b));transform:translateY(100%);transition:transform .3s var(--ease);overflow:hidden}
.overlay.open .sheet{transform:translateY(0)}
.sheet-handle{width:38px;height:4px;border-radius:2px;background:var(--b1);margin:12px auto 0}
.sheet-head{display:flex;align-items:center;gap:14px;padding:18px 20px 14px;border-bottom:1px solid var(--b0)}
.sheet-ava{width:52px;height:52px;border-radius:50%;flex-shrink:0;background:var(--accd);border:2px solid var(--accg);display:flex;align-items:center;justify-content:center;font-family:var(--fd);font-weight:900;font-size:1.3rem;color:var(--acc)}
.sheet-name{font-family:var(--fd);font-weight:900;font-size:1.05rem;color:var(--tx);line-height:1.2}
.sheet-phone{font-size:.75rem;color:var(--tx3);margin-top:4px;font-weight:500}
.sheet-row{display:flex;align-items:center;gap:13px;padding:13px 20px;border-bottom:1px solid var(--b0);cursor:pointer;transition:background .1s;text-decoration:none;color:inherit}
.sheet-row:active{background:var(--s2)}
.sheet-row-ico{width:32px;height:32px;border-radius:10px;background:var(--s2);display:flex;align-items:center;justify-content:center;color:var(--tx3);flex-shrink:0}
.sheet-row-lbl{flex:1;font-size:.84rem;font-weight:600;color:var(--tx2)}
.sheet-row-arr{color:var(--txd)}
.sheet-logout{margin:14px 20px 0;width:calc(100% - 40px);padding:14px;border:none;border-radius:13px;background:rgba(220,38,38,.07);color:#dc2626;font-family:var(--fd);font-weight:900;font-size:.8rem;letter-spacing:.07em;text-transform:uppercase;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;transition:background .12s}
.sheet-logout:active{background:rgba(220,38,38,.15)}

/* ══════════════════════════════════════
   ПОИСК
══════════════════════════════════════ */
.search-bar{
  position:sticky;top:0;z-index:10;
  background:var(--bg);
  padding:10px 20px 8px;
  border-bottom:1px solid var(--b0);
}
.search-inner{
  display:flex;align-items:center;gap:9px;
  background:var(--s1);
  border:1px solid var(--b0);
  border-radius:12px;
  padding:9px 13px;
}
.search-inner input{
  flex:1;border:none;outline:none;background:none;
  font-family:var(--fs);font-size:.85rem;color:var(--tx);
}
.search-inner input::placeholder{color:var(--txd)}
.search-inner svg{color:var(--tx3);flex-shrink:0}

/* ══════════════════════════════════════
   НОВОСТИ
══════════════════════════════════════ */
.news-loading{display:flex;align-items:center;justify-content:center;gap:10px;padding:60px 20px;color:var(--tx3);font-size:.85rem}
.news-spinner{width:18px;height:18px;border-radius:50%;border:2px solid var(--accg);border-top-color:var(--acc);animation:spin .7s linear infinite;flex-shrink:0}
@keyframes spin{to{transform:rotate(360deg)}}
.news-empty{display:flex;flex-direction:column;align-items:center;padding:60px 20px;gap:12px;color:var(--tx3);text-align:center}
.news-empty svg{opacity:.2}
.news-empty-txt{font-size:.85rem;font-weight:600;color:var(--tx3)}
.news-empty-sub{font-size:.75rem;color:var(--txd)}

/* Герой */
.news-hero{
  display:block;border-radius:16px;overflow:hidden;
  background:var(--s1);border:1px solid var(--b0);
  margin-bottom:14px;cursor:pointer;
  transition:transform .18s var(--ease);
  -webkit-tap-highlight-color:transparent;
}
.news-hero:active{transform:scale(.98)}
.news-hero-img{width:100%;aspect-ratio:16/9;object-fit:cover;display:block;background:var(--s2)}
.news-hero-img-ph{width:100%;aspect-ratio:16/9;background:linear-gradient(135deg,var(--s2),var(--accd));display:flex;align-items:center;justify-content:center;color:var(--txd)}
.news-hero-body{padding:14px 16px 16px}
.news-cat{display:inline-flex;align-items:center;font-size:.58rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--acc);background:var(--accd);padding:3px 9px;border-radius:99px;margin-bottom:8px}
.news-hero-title{font-family:var(--fd);font-weight:900;font-size:1.1rem;line-height:1.3;color:var(--tx);margin-bottom:6px}
.news-hero-sub{font-size:.8rem;color:var(--tx3);line-height:1.5;margin-bottom:10px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.news-meta{display:flex;align-items:center;gap:10px;font-size:.68rem;color:var(--txd);flex-wrap:wrap}
.news-meta-item{display:flex;align-items:center;gap:4px}

/* Список */
.news-list{display:flex;flex-direction:column;border-radius:14px;overflow:hidden;border:1px solid var(--b0);background:var(--b0);gap:1px}
.news-card{display:flex;align-items:center;gap:12px;padding:12px 14px;background:var(--s1);cursor:pointer;transition:background .12s}
.news-card:active{background:var(--s2)}
.news-card-thumb{width:66px;height:66px;border-radius:10px;object-fit:cover;flex-shrink:0;background:var(--s2);display:block}
.news-card-thumb-ph{width:66px;height:66px;border-radius:10px;background:var(--accd);flex-shrink:0;display:flex;align-items:center;justify-content:center;color:var(--acc)}
.news-card-body{flex:1;min-width:0}
.news-card-cat{font-size:.55rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--acc);margin-bottom:4px}
.news-card-title{font-family:var(--fd);font-weight:800;font-size:.86rem;color:var(--tx);line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;margin-bottom:5px}
.news-card-meta{font-size:.62rem;color:var(--txd);display:flex;gap:7px;align-items:center}
.news-card-dot{width:3px;height:3px;border-radius:50%;background:var(--txd);flex-shrink:0}
.news-card-arr{color:var(--txd);flex-shrink:0}

/* Секция-заголовок */
.news-section-title{font-family:var(--fd);font-weight:900;font-size:.78rem;color:var(--tx3);letter-spacing:.04em;text-transform:uppercase;margin:16px 0 8px}

/* ── ARTICLE SHEET ── */
.art-overlay{position:fixed;inset:0;z-index:400;background:rgba(0,0,0,.42);display:flex;align-items:flex-end;opacity:0;pointer-events:none;transition:opacity .25s}
.art-overlay.open{opacity:1;pointer-events:auto}
.art-sheet{width:100%;height:94svh;background:var(--bg);border-radius:22px 22px 0 0;display:flex;flex-direction:column;transform:translateY(100%);transition:transform .32s var(--ease);overflow:hidden}
.art-overlay.open .art-sheet{transform:translateY(0)}
.art-handle{width:38px;height:4px;border-radius:2px;background:var(--b1);margin:12px auto 0;flex-shrink:0}
.art-scroll{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch}
.art-cover{width:100%;aspect-ratio:16/9;object-fit:cover;display:block;background:var(--s2)}
.art-cover-ph{width:100%;aspect-ratio:16/9;background:linear-gradient(135deg,var(--s2),var(--accd));display:flex;align-items:center;justify-content:center;color:var(--txd)}
.art-body{padding:20px 20px 40px}
.art-title{font-family:var(--fd);font-weight:900;font-size:1.3rem;line-height:1.25;color:var(--tx);margin-bottom:8px}
.art-sub{font-size:.88rem;color:var(--tx3);line-height:1.55;margin-bottom:14px}
.art-meta{display:flex;align-items:center;gap:14px;padding:12px 0;border-top:1px solid var(--b0);border-bottom:1px solid var(--b0);margin-bottom:18px;flex-wrap:wrap}
.art-meta-item{display:flex;align-items:center;gap:5px;font-size:.7rem;color:var(--tx3)}
.art-text{font-size:.88rem;line-height:1.75;color:var(--tx2);white-space:pre-wrap;word-break:break-word}
.art-views{display:flex;align-items:center;gap:5px;margin-top:24px;font-size:.72rem;color:var(--txd)}
</style>
</head>
<body>

<div class="header">
  <div class="logo"><img src="dastdaroz.png" alt="dastdaroz"/></div>
  <div class="header-right">

  </div>

    <!-- Загрузка -->

  <div class="footer">

    <div class="contacts">

        <div class="ci-body"><div class="ci-val">Душанбе, Тоҷикистон</div></div>
      </div>
      <a href="mailto:info@galelium.com" class="contact-item clickable">

        <div class="ci-body"><div class="ci-val">Душ – Ҷум: 8:00 – 22:00</div></div>
      </div>
    </div>
    <div class="divider"></div>
    <div class="socials-wrap">
      <div class="socials">
        <a href="#" class="soc-btn fb"><svg width="19" height="19" viewBox="0 0 24 24" fill="currentColor"><path d="M18 2h-3a5 5 0 00-5 5v3H7v4h3v8h4v-8h3l1-4h-4V7a1 1 0 011-1h3z"/></svg></a>

</div><!-- end .scroll -->

<!-- ── ARTICLE BOTTOM SHEET ── -->
<div class="art-overlay" id="art-overlay">
  <div class="art-sheet">
    <div class="art-handle"></div>
    <div class="art-scroll">
      <div id="art-inner"></div>
    </div>
  </div>
</div>

<!-- ── PROFILE BOTTOM SHEET ── -->
<div class="overlay" id="overlay">
  <div class="sheet">
    <div class="sheet-handle"></div>
    <div class="sheet-head">
      <div class="sheet-ava" id="sheet-ava">?</div>
      <div>
        <div class="sheet-name" id="sheet-name">—</div>
        <div class="sheet-phone" id="sheet-phone">—</div>
      </div>
    </div>
    <div class="sheet-row" onclick="location.href='orders.html'">
      <div class="sheet-row-ico"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 2L3 6v14a2 2 0 002 2h14a2 2 0 002-2V6l-3-4z"/><line x1="3" y1="6" x2="21" y2="6"/><path d="M16 10a4 4 0 01-8 0"/></svg></div>
      <span class="sheet-row-lbl">Фармоишҳои ман</span>
      <svg class="sheet-row-arr" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 18l6-6-6-6"/></svg>
    </div>
    <button class="sheet-logout" id="btn-logout">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
      Хуруҷ
    </button>
  </div>
</div>

<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/11.8.1/firebase-app.js';
import { getAuth, onAuthStateChanged, signOut } from 'https://www.gstatic.com/firebasejs/11.8.1/firebase-auth.js';
import { getFirestore, collection, query, orderBy, getDocs, doc, updateDoc, increment, serverTimestamp } from 'https://www.gstatic.com/firebasejs/11.8.1/firebase-firestore.js';

const cfg={apiKey:'AIzaSyCjIAMFuwLKwmjChCuiz-MHLv5WZOczAAE',authDomain:'delivery-galelium.firebaseapp.com',projectId:'delivery-galelium',storageBucket:'delivery-galelium.firebasestorage.app',messagingSenderId:'982466555080',appId:'1:982466555080:web:c77ccbff0e71e540ddc9fd'};
const app=initializeApp(cfg), auth=getAuth(app), db=getFirestore(app);

// ── AUTH ──────────────────────────────────────────────────────────
const avatarBtn=document.getElementById('avatar-btn');
const avaIcon=document.getElementById('ava-icon');
const avaInitials=document.getElementById('ava-initials');
const overlay=document.getElementById('overlay');
let currentUser=null;

function initials(n){if(!n)return'?';const p=n.trim().split(/\s+/);return(p.length>1?p[0][0]+p[1][0]:p[0][0]).toUpperCase();}
function emailToPhone(e){if(!e)return'—';const m=e.match(/^992(\d{9})@/);if(!m)return e;const d=m[1];return'+992 '+d.slice(0,2)+' '+d.slice(2,5)+' '+d.slice(5,7)+' '+d.slice(7,9);}

onAuthStateChanged(auth,user=>{
  currentUser=user;
  if(user){
    const ini=initials(user.displayName);
    avaIcon.style.display='none'; avaInitials.style.display=''; avaInitials.textContent=ini;
    avatarBtn.classList.add('authed');
    document.getElementById('sheet-ava').textContent=ini;
    document.getElementById('sheet-name').textContent=user.displayName||'Корбар';
    document.getElementById('sheet-phone').textContent=emailToPhone(user.email);
  } else {
    avaIcon.style.display=''; avaInitials.style.display='none';
    avatarBtn.classList.remove('authed');
  }
});
avatarBtn.addEventListener('click',()=>{ if(currentUser)overlay.classList.add('open'); else location.href='login.html'; });
overlay.addEventListener('click',e=>{ if(e.target===overlay)overlay.classList.remove('open'); });
document.getElementById('btn-logout').addEventListener('click',async()=>{ await signOut(auth); overlay.classList.remove('open'); });

// ── ПОИСК ────────────────────────────────────────────────────────
const searchToggle=document.getElementById('search-toggle-btn');
const searchBar=document.getElementById('search-bar');
const searchInp=document.getElementById('search-inp');
let searchOpen=false;

searchToggle.addEventListener('click',()=>{
  searchOpen=!searchOpen;
  searchBar.style.display=searchOpen?'block':'none';
  if(searchOpen){searchInp.focus();}
  else{searchInp.value='';renderNews(allArticles);}
});

searchInp.addEventListener('input',()=>{
  const q=searchInp.value.trim().toLowerCase();
  if(!q){renderNews(allArticles);return;}
  const found=allArticles.filter(a=>
    a.title?.toLowerCase().includes(q)||
    a.subtitle?.toLowerCase().includes(q)||
    a.content?.toLowerCase().includes(q)||
    a.category?.toLowerCase().includes(q)
  );
  renderNews(found,true);
});

// ── НОВОСТИ ──────────────────────────────────────────────────────
let allArticles=[];

function esc(s){return(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}

function fmtDate(ts){
  if(!ts?.toDate)return'';
  return ts.toDate().toLocaleDateString('ru-RU',{day:'numeric',month:'short'});
}

function cover(url,bigCls,phCls){
  if(url)return`<img class="${bigCls}" src="${esc(url)}" alt="" onerror="this.style.display='none';this.nextElementSibling&&(this.nextElementSibling.style.display='flex')">`;
  return`<div class="${phCls}"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.3"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg></div>`;
}

function renderNews(articles, isSearch=false){
  const loading=document.getElementById('news-loading');
  const heroWrap=document.getElementById('hero-wrap');
  const listSection=document.getElementById('list-section');
  const newsList=document.getElementById('news-list');
  const empty=document.getElementById('news-empty');

  loading.style.display='none';

  if(!articles.length){
    heroWrap.style.display='none';
    listSection.style.display='none';
    empty.style.display='flex';
    return;
  }
  empty.style.display='none';

  if(isSearch){
    // При поиске — только список без героя
    heroWrap.style.display='none';
    listSection.style.display='block';
    document.querySelector('.news-section-title').textContent='Натиҷаи ҷустуҷӯ';
    newsList.innerHTML=articles.map(a=>cardHtml(a)).join('');
    return;
  }

  // Герой — первая статья
  const hero=articles[0];
  heroWrap.style.display='block';
  heroWrap.innerHTML=`
    <div class="news-hero" onclick="openArticle('${hero.id}')">
      ${cover(hero.coverUrl,'news-hero-img','news-hero-img-ph')}
      <div class="news-hero-body">
        ${hero.category?`<div class="news-cat">${esc(hero.category)}</div>`:''}
        <div class="news-hero-title">${esc(hero.title)}</div>
        ${hero.subtitle?`<div class="news-hero-sub">${esc(hero.subtitle)}</div>`:''}
        <div class="news-meta">
          <div class="news-meta-item">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
            ${hero.readingTime||3} дақ
          </div>
          <div class="news-meta-item">${fmtDate(hero.createdAt)}</div>
          ${hero.views?`<div class="news-meta-item"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>${hero.views}</div>`:''}
        </div>
      </div>
    </div>`;

  // Остальные
  if(articles.length>1){
    document.querySelector('.news-section-title').textContent='Дигар хабарҳо';
    listSection.style.display='block';
    newsList.innerHTML=articles.slice(1).map(a=>cardHtml(a)).join('');
  } else {
    listSection.style.display='none';
  }
}

function cardHtml(a){
  return`<div class="news-card" onclick="openArticle('${a.id}')">
    ${cover(a.coverUrl,'news-card-thumb','news-card-thumb-ph')}
    <div class="news-card-body">
      ${a.category?`<div class="news-card-cat">${esc(a.category)}</div>`:''}
      <div class="news-card-title">${esc(a.title)}</div>
      <div class="news-card-meta">
        <span>${fmtDate(a.createdAt)}</span>
        <div class="news-card-dot"></div>
        <span>${a.readingTime||3} дақ</span>
      </div>
    </div>
    <svg class="news-card-arr" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 18l6-6-6-6"/></svg>
  </div>`;
}

async function loadNews(){
  try{
    // БЕЗ where() — фильтруем на клиенте, чтобы не нужен составной индекс
    const q=query(collection(db,'news'),orderBy('createdAt','desc'));
    const snap=await getDocs(q);
    allArticles=snap.docs
      .map(d=>({id:d.id,...d.data()}))
      .filter(a=>a.status==='published');
    renderNews(allArticles);
  }catch(e){
    console.error('Ошибка загрузки новостей:',e);
    document.getElementById('news-loading').style.display='none';
    document.getElementById('news-empty').style.display='flex';
  }
}

// ── СТАТЬЯ ───────────────────────────────────────────────────────
const artOverlay=document.getElementById('art-overlay');

window.openArticle=function(id){
  const a=allArticles.find(x=>x.id===id);
  if(!a)return;

  document.getElementById('art-inner').innerHTML=`
    ${cover(a.coverUrl,'art-cover','art-cover-ph')}
    <div class="art-body">
      ${a.category?`<div class="news-cat">${esc(a.category)}</div>`:''}
      <div class="art-title">${esc(a.title)}</div>
      ${a.subtitle?`<div class="art-sub">${esc(a.subtitle)}</div>`:''}
      <div class="art-meta">
        <div class="art-meta-item">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
          ${esc(a.author||'Таҳририя')}
        </div>
        <div class="art-meta-item">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
          ${a.readingTime||3} дақ
        </div>
        <div class="art-meta-item">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
          ${fmtDate(a.createdAt)}
        </div>
      </div>
      <div class="art-text">${esc(a.content)}</div>
      <div class="art-views">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
        ${(a.views||0)+1} нафар хонд
      </div>
    </div>`;

  artOverlay.classList.add('open');
  artOverlay.querySelector('.art-scroll').scrollTop=0;

  // Инкремент просмотров
  updateDoc(doc(db,'news',id),{views:increment(1),updatedAt:serverTimestamp()}).catch(()=>{});
};

artOverlay.addEventListener('click',e=>{ if(e.target===artOverlay)artOverlay.classList.remove('open'); });
document.addEventListener('keydown',e=>{ if(e.key==='Escape')artOverlay.classList.remove('open'); });

loadNews();
</script>
</body>
</html>
