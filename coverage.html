<!DOCTYPE html>
<!--
╔══════════════════════════════════════════════════════════════════╗
║              ШАБЛОН DASTDAROZ — ПРАВИЛА ДЛЯ ИИ                  ║
╠══════════════════════════════════════════════════════════════════╣
║                                                                  ║
║  ЕДИНСТВЕННАЯ ЗОНА РЕДАКТИРОВАНИЯ:                               ║
║  Блок между метками КОНТЕНТ START и КОНТЕНТ END внутри .content  ║
║                                                                  ║
║  ЧТО ЗАПРЕЩЕНО ТРОГАТЬ:                                          ║
║  ✗  <div class="header"> ... </div>   — топ-бар с логотипом     ║
║  ✗  <div class="footer"> ... </div>   — контакты и соцсети      ║
║  ✗  <div class="overlay"> ... </div>  — профиль bottom sheet     ║
║  ✗  <style> ... </style>              — все CSS переменные       ║
║  ✗  <script> ... </script>            — Firebase auth логика     ║
║  ✗  Классы: header, logo, footer, divider, contacts,            ║
║             socials-wrap, overlay, sheet и их дочерние эл-ты     ║
║                                                                  ║
║  ЧТО РАЗРЕШЕНО:                                                  ║
║  ✓  Заменить содержимое между КОНТЕНТ START / КОНТЕНТ END        ║
║  ✓  Добавлять новые CSS-классы в <style> для контента страницы   ║
║  ✓  Добавлять JS для контента (НЕ трогая существующий <script>)  ║
║  ✓  Менять <title> на название конкретной страницы               ║
║  ✓  Добавлять страницы в массив SEARCH_PAGES в первом <script>   ║
║                                                                  ║
╠══════════════════════════════════════════════════════════════════╣
║  КАК РАБОТАЕТ СКРОЛЛ И ФУТЕР — ВАЖНО                            ║
╠══════════════════════════════════════════════════════════════════╣
║                                                                  ║
║  Скролл — как на обычном сайте (вся страница), футер всегда      ║
║  внизу — даже если контента мало.                                ║
║                                                                  ║
║    body      → min-height:100svh + flex-column — тянется        ║
║                минимум на весь экран, НО может быть длиннее      ║
║    .header   → position:sticky; top:0 — прилипает к верху,      ║
║                всегда виден, НЕ скроллится                       ║
║    .scroll   → flex:1 — занимает всё свободное место,           ║
║                толкает футер вниз при коротком контенте          ║
║    .content  → обычный блок, растёт по контенту                  ║
║    .footer   → всегда у низа экрана (или ниже при длинном        ║
║                контенте), скроллится вместе со страницей         ║
║                                                                  ║
║  ✗  НЕ ДЕЛАЙ так (ломает скролл):                               ║
║     • overflow:hidden на body — убивает скролл страницы          ║
║     • height:100svh на body — обрезает контент (нужен min-height)║
║     • overflow:auto/scroll на .scroll или .content               ║
║     • position:fixed на .footer (он должен скроллиться!)         ║
║                                                                  ║
║  ✓  ДЕЛАЙ так:                                                   ║
║     • Просто кидай контент между КОНТЕНТ START / КОНТЕНТ END     ║
║     • Контент сам растёт, скролл страницы сам появляется         ║
║     • Если нужен отступ снизу у последнего блока — только        ║
║       margin-bottom на последнем элементе внутри .content        ║
║                                                                  ║
║  ДИЗАЙН-ТОКЕНЫ (используй их, не придумывай цвета):             ║
║  --acc   #1a9e4a  — основной зелёный                             ║
║  --acc2  #22c55e  — светлее                                      ║
║  --accd  rgba(26,158,74,.09)  — фон акцента                      ║
║  --bg    #f3f7f4  — фон страницы                                 ║
║  --s1    #ffffff  — карточки / шапки                             ║
║  --s2    #edf4ef  — вторичный фон                                ║
║  --tx    #171f1a  — основной текст                               ║
║  --tx2   #3d5244  — второстепенный                               ║
║  --tx3   #7a9882  — подписи / плейсхолдеры                       ║
║  --fd    'Unbounded' — заголовки (font-weight 700-900)           ║
║  --fs    'Inter'   — текст                                       ║
║                                                                  ║
╚══════════════════════════════════════════════════════════════════╝
-->
<html lang="ru">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover"/>
<meta name="mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<title>Зона покрытия — dastdaroz</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@700;800;900&family=Inter:wght@400;500;600;700&display=swap"/>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
:root{
  --acc:#1a9e4a;--acc2:#22c55e;--accd:rgba(26,158,74,.09);--accg:rgba(26,158,74,.2);
  --bg:#f3f7f4;--s1:#ffffff;--s2:#edf4ef;
  --b0:rgba(0,0,0,.07);--b1:rgba(0,0,0,.15);
  --tx:#171f1a;--tx2:#3d5244;--tx3:#7a9882;--txd:#b0c4b8;
  --fd:'Unbounded',sans-serif;--fs:'Inter',system-ui,sans-serif;
  --safe-t:env(safe-area-inset-top,0px);
  --safe-b:env(safe-area-inset-bottom,0px);
  --ease:cubic-bezier(.32,0,.18,1);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{-webkit-text-size-adjust:100%}
body{
  background:var(--bg);color:var(--tx);
  font-family:var(--fs);
  min-height:100svh;
  display:flex;flex-direction:column;
  padding-top:var(--safe-t);
  -webkit-font-smoothing:antialiased;
}
a{color:inherit;text-decoration:none}

/* ── HEADER ── */
.header{
  position:sticky;top:0;
  display:flex;align-items:center;justify-content:space-between;
  padding:0 20px;
  height:54px;
  border-bottom:1px solid var(--b0);
  background:var(--s1);
  z-index:100;
}
.logo{
  display:flex;align-items:center;
  height:100%;
}
.logo img{
  height:28px;width:auto;object-fit:contain;display:block;
}
.header-right{display:flex;align-items:center;gap:10px}

/* ── AVATAR BUTTON ── */
.avatar-btn{
  width:36px;height:36px;border-radius:50%;flex-shrink:0;
  background:var(--s2);
  border:2px solid var(--b0);
  display:flex;align-items:center;justify-content:center;
  cursor:pointer;outline:none;
  transition:border-color .15s,background .15s;
  color:var(--tx3);
  font-family:var(--fd);font-weight:900;font-size:.75rem;
}
.avatar-btn:active{background:var(--accd);border-color:var(--acc)}
.avatar-btn.authed{
  background:var(--accd);
  border-color:var(--accg);
  color:var(--acc);
}

/* ── SEARCH BUTTON ── */
.search-btn{
  width:36px;height:36px;border-radius:50%;flex-shrink:0;
  background:var(--s2);
  border:2px solid var(--b0);
  display:flex;align-items:center;justify-content:center;
  cursor:pointer;outline:none;
  transition:border-color .15s,background .15s;
  color:var(--tx3);
}
.search-btn:active{background:var(--accd);border-color:var(--acc)}
.search-btn.active{background:var(--accd);border-color:var(--accg);color:var(--acc)}

/* ── SEARCH PANEL ── */
.search-panel{
  position:sticky;
  top:54px;
  z-index:99;
  background:var(--s1);
  border-bottom:1px solid var(--b0);
  display:none;
}
.search-panel.open{display:block}

.search-bar{
  display:flex;align-items:center;gap:10px;
  padding:10px 16px;
  border-bottom:1px solid var(--b0);
}
.search-bar-ico{color:var(--tx3);flex-shrink:0;display:flex}
.search-input{
  flex:1;border:none;outline:none;background:none;
  font-family:var(--fs);font-size:.9rem;color:var(--tx);
  caret-color:var(--acc);
}
.search-input::placeholder{color:var(--tx3)}
.search-clear{
  width:26px;height:26px;border-radius:50%;border:none;
  background:var(--s2);
  display:flex;align-items:center;justify-content:center;
  cursor:pointer;color:var(--tx3);flex-shrink:0;
  opacity:0;pointer-events:none;transition:opacity .12s;
}
.search-clear.visible{opacity:1;pointer-events:auto}
.search-clear:active{background:var(--b0)}

.search-results{max-height:52vh;overflow-y:auto;-webkit-overflow-scrolling:touch}

.search-result-item{
  display:block;padding:12px 16px;
  text-decoration:none;color:inherit;
  border-bottom:1px solid var(--b0);
  transition:background .1s;cursor:pointer;
}
.search-result-item:last-child{border-bottom:none}
.search-result-item:active{background:var(--s2)}
.sri-title{
  font-family:var(--fd);font-weight:800;font-size:.85rem;
  color:var(--tx);margin-bottom:3px;
}
.sri-snippet{
  font-size:.75rem;color:var(--tx3);line-height:1.5;
  overflow:hidden;display:-webkit-box;
  -webkit-line-clamp:2;-webkit-box-orient:vertical;
}
.sri-snippet mark,.sri-title mark{
  background:var(--accd);color:var(--acc);
  border-radius:3px;padding:0 2px;font-weight:600;font-style:normal;
}
.search-status{
  padding:22px 16px;text-align:center;
  font-size:.82rem;color:var(--tx3);line-height:1.5;
}

/* ── SCROLL AREA — flex:1 толкает футер вниз, скролл по всей странице ── */
.scroll{flex:1}

/* ── MAIN CONTENT ── */
.content{
  padding:20px;
}

/* ── FOOTER — скроллится вместе со страницей ── */
.footer{
  background:var(--s1);
  border-top:1px solid var(--b0);
}

/* ── DIVIDER ── */
.divider{height:1px;background:var(--b0);margin:0 20px}

/* ── CONTACTS ── */
.contacts{padding:3px 0}
.contact-item{
  display:flex;align-items:center;gap:12px;
  padding:9px 20px;
  text-decoration:none;color:inherit;
  transition:background .1s;
}
.contact-item.clickable{cursor:pointer}
.contact-item.clickable:active{background:var(--s2)}
.ci-icon{
  width:28px;height:28px;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;
  color:var(--tx3);
}
.ci-body{flex:1;min-width:0}
.ci-val{font-family:var(--fd);font-size:.8rem;font-weight:700;color:var(--tx2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ci-sub{font-family:var(--fd);font-size:.55rem;font-weight:700;letter-spacing:.03em;color:var(--tx3);margin-top:1px}
.ci-arrow{color:var(--txd);flex-shrink:0}

/* ── SOCIALS ── */
.socials-wrap{padding:8px 20px calc(10px + var(--safe-b))}
.socials{display:flex;gap:9px}
.soc-btn{
  width:42px;height:42px;border-radius:11px;
  display:flex;align-items:center;justify-content:center;
  color:#fff;cursor:pointer;
  transition:opacity .12s,transform .12s;
  flex-shrink:0;
}
.soc-btn:active{opacity:.7;transform:scale(.93)}
.soc-btn.fb{background:#1877f2}
.soc-btn.ig{background:linear-gradient(135deg,#f09433,#e6683c,#dc2743,#cc2366,#bc1888)}
.soc-btn.tg{background:#2aabee}
.soc-btn.yt{background:#ff0000}

/* ══════════════════════════════════════
   PROFILE MODAL (bottom sheet)
══════════════════════════════════════ */
.overlay{
  position:fixed;inset:0;z-index:500;
  background:rgba(0,0,0,.38);
  display:flex;align-items:flex-end;
  opacity:0;pointer-events:none;
  transition:opacity .22s;
  backdrop-filter:blur(3px);
  -webkit-backdrop-filter:blur(3px);
}
.overlay.open{opacity:1;pointer-events:auto}

.sheet{
  width:100%;
  background:var(--s1);
  border-radius:22px 22px 0 0;
  padding-bottom:calc(20px + var(--safe-b));
  transform:translateY(100%);
  transition:transform .3s var(--ease);
  overflow:hidden;
}
.overlay.open .sheet{transform:translateY(0)}

.sheet-handle{
  width:38px;height:4px;border-radius:2px;
  background:var(--b1);
  margin:12px auto 0;
}
.sheet-head{
  display:flex;align-items:center;gap:14px;
  padding:18px 20px 14px;
  border-bottom:1px solid var(--b0);
}
.sheet-ava{
  width:52px;height:52px;border-radius:50%;flex-shrink:0;
  background:var(--accd);
  border:2px solid var(--accg);
  display:flex;align-items:center;justify-content:center;
  font-family:var(--fd);font-weight:900;font-size:1.3rem;
  color:var(--acc);
}
.sheet-info{}
.sheet-name{font-family:var(--fd);font-weight:900;font-size:1.05rem;color:var(--tx);line-height:1.2}
.sheet-phone{font-size:.75rem;color:var(--tx3);margin-top:4px;font-weight:500;letter-spacing:.02em}

.sheet-row{
  display:flex;align-items:center;gap:13px;
  padding:13px 20px;
  border-bottom:1px solid var(--b0);
  cursor:pointer;transition:background .1s;
  text-decoration:none;color:inherit;
}
.sheet-row:active{background:var(--s2)}
.sheet-row-ico{
  width:32px;height:32px;border-radius:10px;
  background:var(--s2);
  display:flex;align-items:center;justify-content:center;
  color:var(--tx3);flex-shrink:0;
}
.sheet-row-lbl{flex:1;font-size:.84rem;font-weight:600;color:var(--tx2)}
.sheet-row-arr{color:var(--txd)}

.sheet-logout{
  margin:14px 20px 0;
  width:calc(100% - 40px);
  padding:14px;border:none;border-radius:13px;
  background:rgba(220,38,38,.07);
  color:#dc2626;
  font-family:var(--fd);font-weight:900;font-size:.8rem;
  letter-spacing:.07em;text-transform:uppercase;
  cursor:pointer;
  display:flex;align-items:center;justify-content:center;gap:8px;
  transition:background .12s;
}
.sheet-logout:active{background:rgba(220,38,38,.15)}

/* ═══════════════════════════════════════════════════════════════
   COVERAGE PAGE — дополнительные стили
   Всё ниже относится только к этой странице
═══════════════════════════════════════════════════════════════ */

/* Убираем общий padding у .content — управляем отступами внутри */
.content{padding:0}

/* ── Compact header ───────────────────────────────────────────── */
.cov-head{
  padding:16px 20px 14px;
  border-bottom:1px solid var(--b0);
  background:var(--s1);
  display:flex;align-items:center;justify-content:space-between;gap:12px;
}
.cov-head-left{flex:1;min-width:0}
.cov-head-title{
  font-family:var(--fd);font-weight:900;font-size:1rem;
  color:var(--tx);
}
.cov-head-sub{
  font-size:.78rem;color:var(--tx3);font-weight:500;
  margin-top:3px;
  min-height:1.1em;
}
.cov-head-flag{
  height:28px;width:auto;
  border-radius:5px;
  object-fit:cover;
  flex-shrink:0;
  box-shadow:0 1px 4px rgba(0,0,0,.12);
}

/* ── City body ────────────────────────────────────────────────── */
.cov-body{
  padding:16px 16px 28px;
  display:flex;flex-direction:column;gap:20px;
}
.cov-section{}
.cov-region-lbl{
  font-family:var(--fd);font-weight:900;font-size:.6rem;
  letter-spacing:.1em;text-transform:uppercase;
  color:var(--tx3);margin-bottom:10px;
}
.cov-rows{
  display:flex;flex-direction:column;gap:8px;
}

/* ── City row (полноширокий) ──────────────────────────────────── */
.city-row{
  display:flex;align-items:center;gap:12px;
  padding:14px 16px;
  border-radius:14px;
  background:var(--s1);
  border:1.5px solid var(--b0);
  width:100%;
  user-select:none;
}
.city-row.active-row{
  cursor:pointer;
  transition:background .13s,border-color .13s;
}
.city-row.active-row:active{background:var(--accd);border-color:var(--acc)}
.city-row.inactive-row{opacity:.38;cursor:default;pointer-events:none}

.city-dot{
  width:8px;height:8px;border-radius:50%;
  background:var(--acc);flex-shrink:0;
}
.city-nm{
  font-family:var(--fd);font-weight:800;font-size:.8rem;
  color:var(--tx2);flex:1;
}
.city-row.inactive-row .city-nm{color:var(--tx3)}
.city-soon{
  font-size:.62rem;font-weight:600;font-family:var(--fs);
  color:var(--tx3);background:var(--s2);
  padding:3px 8px;border-radius:6px;
  letter-spacing:.04em;white-space:nowrap;
}

/* ── Skeleton loading ─────────────────────────────────────────── */
@keyframes cov-shimmer{
  0%{background-position:-200% 0}
  100%{background-position:200% 0}
}
.skel{
  background:linear-gradient(90deg,var(--s2) 25%,rgba(255,255,255,.7) 50%,var(--s2) 75%);
  background-size:200% 100%;
  animation:cov-shimmer 1.4s infinite;
  flex-shrink:0;
}
.skel-row{height:50px;border-radius:14px;width:100%}

/* ── Error state ──────────────────────────────────────────────── */
.cov-err{
  padding:52px 20px 28px;
  display:flex;flex-direction:column;align-items:center;
  text-align:center;gap:10px;
}
.cov-err-ico{color:var(--txd)}
.cov-err-title{
  font-family:var(--fd);font-weight:900;font-size:.92rem;
  color:var(--tx2);
}
.cov-err-sub{font-size:.78rem;color:var(--tx3);line-height:1.5}

/* ── City detail sheet ────────────────────────────────────────── */
/* Переопределяем .bs-body для sheet'а с картой */
#bs-body-city-detail{
  padding:0!important;
  overflow:hidden!important;
  display:flex!important;
  flex-direction:column!important;
}
.city-det-map{
  flex:1;min-height:0;
  width:100%;
}
/* Подавляем чёрную рамку Leaflet-фокуса */
.city-det-map .leaflet-container:focus{outline:none}
.city-det-foot{
  background:var(--s1);
  border-top:1px solid var(--b0);
  padding:12px 18px calc(12px + var(--safe-b));
  flex-shrink:0;
  display:flex;align-items:center;gap:10px;
}
.city-det-region{
  font-family:var(--fd);font-size:.58rem;font-weight:700;
  letter-spacing:.1em;text-transform:uppercase;
  color:var(--tx3);
}
.city-det-coords{
  font-size:.7rem;color:var(--txd);
  font-family:monospace;
  margin-left:auto;
}
/* Стрелка у активного города */
.city-row-arr{
  color:var(--txd);
  flex-shrink:0;
  display:flex;align-items:center;
}
</style>
</head>
<body>

<!-- ── HEADER — НЕ ТРОГАТЬ ── -->
<div class="header">
  <div class="logo">
    <img src="dastdaroz.png" alt="dastdaroz"/>
  </div>
  <div class="header-right">
    <button class="search-btn" id="search-btn" aria-label="Поиск">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
        <circle cx="11" cy="11" r="7"/><path d="M21 21l-4.35-4.35"/>
      </svg>
    </button>
    <button class="avatar-btn" id="avatar-btn" aria-label="Профиль">
      <svg id="ava-icon" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/>
        <circle cx="12" cy="7" r="4"/>
      </svg>
      <span id="ava-initials" style="display:none"></span>
    </button>
  </div>
</div>

<!-- ── SEARCH PANEL — НЕ ТРОГАТЬ ── -->
<div class="search-panel" id="search-panel">
  <div class="search-bar">
    <span class="search-bar-ico">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
        <circle cx="11" cy="11" r="7"/><path d="M21 21l-4.35-4.35"/>
      </svg>
    </span>
    <input class="search-input" id="search-input" type="search"
      placeholder="Поиск..." autocomplete="off" autocorrect="off"
      autocapitalize="off" spellcheck="false"/>
    <button class="search-clear" id="search-clear" aria-label="Очистить">
      <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
        <path d="M18 6L6 18M6 6l12 12"/>
      </svg>
    </button>
  </div>
  <div class="search-results" id="search-results"></div>
</div>

<div class="scroll">

<script>
// ════════════════════════════════════════════════════════════════
// ПОИСК — НАСТРОЙКА СТРАНИЦ
// ════════════════════════════════════════════════════════════════
const SEARCH_PAGES = [
  // { title: 'Главная',        path: 'index.html'   },
  // { title: 'Зона покрытия',  path: 'coverage.html'},
];

(function(){
  const searchBtn     = document.getElementById('search-btn');
  const searchPanel   = document.getElementById('search-panel');
  const searchInput   = document.getElementById('search-input');
  const searchClear   = document.getElementById('search-clear');
  const searchResults = document.getElementById('search-results');

  let index    = null;
  let loading  = false;
  let timer    = null;

  function open() {
    searchPanel.classList.add('open');
    searchBtn.classList.add('active');
    searchInput.focus();
    if (!index && !loading) buildIndex();
  }
  function close() {
    searchPanel.classList.remove('open');
    searchBtn.classList.remove('active');
    searchInput.value = '';
    searchClear.classList.remove('visible');
    searchResults.innerHTML = '';
  }

  searchBtn.addEventListener('click', () =>
    searchPanel.classList.contains('open') ? close() : open()
  );
  searchClear.addEventListener('click', () => {
    searchInput.value = '';
    searchClear.classList.remove('visible');
    searchResults.innerHTML = '';
    searchInput.focus();
  });
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape' && searchPanel.classList.contains('open')) close();
  });

  async function buildIndex() {
    if (!SEARCH_PAGES.length) { index = []; return; }
    loading = true;
    searchResults.innerHTML = '<div class="search-status">Загрузка…</div>';
    const parser = new DOMParser();
    index = [];
    await Promise.all(SEARCH_PAGES.map(async page => {
      try {
        const res = await fetch(page.path);
        if (!res.ok) return;
        const html = await res.text();
        const doc  = parser.parseFromString(html, 'text/html');
        const el   = doc.querySelector('.content');
        const text = (el ? el.textContent : '').replace(/\s+/g,' ').trim();
        index.push({ title: page.title, path: page.path, text });
      } catch(e) {}
    }));
    loading = false;
    searchResults.innerHTML = '';
    const q = searchInput.value.trim();
    if (q.length >= 2) doSearch(q);
  }

  searchInput.addEventListener('input', () => {
    const q = searchInput.value.trim();
    searchClear.classList.toggle('visible', q.length > 0);
    clearTimeout(timer);
    timer = setTimeout(() => doSearch(q), 180);
  });

  function esc(s){ return s.replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
  function hi(text, q){
    return esc(text).replace(
      new RegExp(esc(q).replace(/[.*+?^${}()|[\]\\]/g,'\\$&'),'gi'),
      m => '<mark>'+m+'</mark>'
    );
  }

  function doSearch(q) {
    if (!q || q.length < 2) { searchResults.innerHTML = ''; return; }
    if (loading || !index) {
      searchResults.innerHTML = '<div class="search-status">Загрузка…</div>';
      return;
    }
    if (!index.length) {
      searchResults.innerHTML = '<div class="search-status">Страницы для поиска не добавлены</div>';
      return;
    }
    const low  = q.toLowerCase();
    const hits = [];
    for (const page of index) {
      const ti = page.title.toLowerCase().indexOf(low);
      const tx = page.text.toLowerCase().indexOf(low);
      if (ti === -1 && tx === -1) continue;
      let snippet = '';
      if (tx !== -1) {
        const s = Math.max(0, tx - 45);
        const e = Math.min(page.text.length, tx + q.length + 90);
        snippet = (s > 0 ? '…' : '') + page.text.slice(s, e) + (e < page.text.length ? '…' : '');
      } else {
        snippet = page.text.slice(0, 130) + (page.text.length > 130 ? '…' : '');
      }
      hits.push({ page, snippet });
    }
    if (!hits.length) {
      searchResults.innerHTML = `<div class="search-status">«${esc(q)}» не найдено</div>`;
      return;
    }
    searchResults.innerHTML = hits.map(({page, snippet}) => `
      <a href="${esc(page.path)}" class="search-result-item">
        <div class="sri-title">${hi(page.title, q)}</div>
        <div class="sri-snippet">${hi(snippet, q)}</div>
      </a>
    `).join('');
  }
})();
</script>

<script type="module">
// ═══ НЕ ТРОГАТЬ — Firebase auth логика ════════════════════════
import { auth } from './firebase.js';
import {
  onAuthStateChanged,
  signOut,
} from 'https://www.gstatic.com/firebasejs/11.8.1/firebase-auth.js';

const avatarBtn   = document.getElementById('avatar-btn');
const avaIcon     = document.getElementById('ava-icon');
const avaInitials = document.getElementById('ava-initials');
const overlay     = document.getElementById('overlay');
const sheetAva    = document.getElementById('sheet-ava');
const sheetName   = document.getElementById('sheet-name');
const sheetPhone  = document.getElementById('sheet-phone');
const btnLogout   = document.getElementById('btn-logout');

let currentUser = null;

function initials(name) {
  if (!name) return '?';
  const p = name.trim().split(/\s+/);
  return p.length > 1
    ? (p[0][0] + p[1][0]).toUpperCase()
    : p[0][0].toUpperCase();
}

function emailToPhone(email) {
  if (!email) return '—';
  const m = email.match(/^992(\d{9})@/);
  if (!m) return email;
  const d = m[1];
  return '+992 ' + d.slice(0,2) + ' ' + d.slice(2,5) + ' ' + d.slice(5,7) + ' ' + d.slice(7,9);
}

onAuthStateChanged(auth, user => {
  currentUser = user;
  if (user) {
    const ini = initials(user.displayName);
    avaIcon.style.display     = 'none';
    avaInitials.style.display = '';
    avaInitials.textContent   = ini;
    avatarBtn.classList.add('authed');
    sheetAva.textContent   = ini;
    sheetName.textContent  = user.displayName || 'Пользователь';
    sheetPhone.textContent = emailToPhone(user.email);
  } else {
    avaIcon.style.display     = '';
    avaInitials.style.display = 'none';
    avatarBtn.classList.remove('authed');
  }
});

avatarBtn.addEventListener('click', () => {
  if (currentUser) {
    overlay.classList.add('open');
  } else {
    window.location.href = 'login.html';
  }
});

overlay.addEventListener('click', e => {
  if (e.target === overlay) overlay.classList.remove('open');
});

btnLogout.addEventListener('click', async () => {
  await signOut(auth);
  overlay.classList.remove('open');
});
</script>

<!-- ═══════════════════════════════════════════════════════════════
     COVERAGE PAGE — логика загрузки городов
     Требует: firebase.js должен экспортировать `db` (Firestore)
     Пример: export const db = getFirestore(app);
═══════════════════════════════════════════════════════════════ -->
<script type="module">
import { db } from './firebase.js';
import { Sheet } from './sheet.js';
import {
  collection,
  getDocs,
  query,
  orderBy,
} from 'https://www.gstatic.com/firebasejs/11.8.1/firebase-firestore.js';

// ── Вспомогательные функции ────────────────────────────────────

/** Склонение: 1 город / 2 города / 5 городов */
function pluralCity(n) {
  const m  = n % 100;
  const m2 = n % 10;
  if (m >= 11 && m <= 14) return 'городов';
  if (m2 === 1) return 'город';
  if (m2 >= 2 && m2 <= 4) return 'города';
  return 'городов';
}

// ── DOM-ссылки ─────────────────────────────────────────────────
const subEl  = document.getElementById('cov-sub');
const bodyEl = document.getElementById('cov-body');

// ── Состояние ─────────────────────────────────────────────────
let regionMap = new Map(); // region → City[]

// ═══════════════════════════════════════════════════════════════
//  CITY DETAIL SHEET — инициализация
// ═══════════════════════════════════════════════════════════════

let _map    = null; // Leaflet map
let _marker = null; // текущий маркер

// 1. Регистрируем sheet
Sheet.define({
  id:     'city-detail',
  title:  '—',
  zIndex: 800,
  onOpen() {
    // Leaflet не знает реальный размер, пока sheet скрыт (transform).
    // Инвалидируем после окончания CSS-перехода (0.38s в sheet.js).
    setTimeout(() => _map?.invalidateSize(), 400);
  },
});

// 2. Наполняем тело sheet'а
Sheet.body('city-detail').innerHTML = `
  <div class="city-det-map" id="city-det-map"></div>
  <div class="city-det-foot">
    <div class="city-det-region" id="city-det-region"></div>
    <div class="city-det-coords" id="city-det-coords"></div>
  </div>
`;

// 3. Инициализируем Leaflet (центр Таджикистана по умолчанию)
_map = L.map('city-det-map', {
  zoomControl: true,
  attributionControl: true,
}).setView([38.86, 71.28], 6);

L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  maxZoom: 19,
  attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>',
}).addTo(_map);

/** Открыть sheet с картой конкретного города */
function openCityDetail(city) {
  const lat = typeof city.lat === 'number' ? city.lat : null;
  const lng = typeof city.lng === 'number' ? city.lng : null;

  // Обновляем заголовок и футер
  Sheet.setTitle('city-detail', city.name);
  document.getElementById('city-det-region').textContent = city.region || '';
  document.getElementById('city-det-coords').textContent =
    lat !== null ? `${lat.toFixed(4)}, ${lng.toFixed(4)}` : '';

  Sheet.open('city-detail');

  // Даём sheet чуть-чуть появиться, потом двигаем карту
  setTimeout(() => {
    _map.invalidateSize();
    if (lat !== null) {
      _map.setView([lat, lng], 12, { animate: false });
      _marker?.remove();
      _marker = L.marker([lat, lng]).addTo(_map);
    } else {
      // Координаты не указаны — показываем весь Таджикистан
      _map.setView([38.86, 71.28], 6, { animate: false });
      _marker?.remove();
      _marker = null;
    }
  }, 100);
}

// ═══════════════════════════════════════════════════════════════
//  РЕНДЕР СПИСКА ГОРОДОВ
// ═══════════════════════════════════════════════════════════════

function renderCities() {
  bodyEl.innerHTML = '';
  const wrap = document.createElement('div');
  wrap.className = 'cov-body';

  [...regionMap.entries()].forEach(([region, cities]) => {
    const sec = document.createElement('div');
    sec.className = 'cov-section';

    const lbl = document.createElement('div');
    lbl.className = 'cov-region-lbl';
    lbl.textContent = region;

    const rows = document.createElement('div');
    rows.className = 'cov-rows';
    cities.forEach(city => rows.appendChild(makeRow(city)));

    sec.appendChild(lbl);
    sec.appendChild(rows);
    wrap.appendChild(sec);
  });

  bodyEl.appendChild(wrap);
}

// ── Создать строку города ──────────────────────────────────────
function makeRow(city) {
  const row = document.createElement('div');
  row.className = 'city-row ' + (city.active ? 'active-row' : 'inactive-row');

  if (city.active) {
    const dot = document.createElement('span');
    dot.className = 'city-dot';
    row.appendChild(dot);
  }

  const nm = document.createElement('span');
  nm.className = 'city-nm';
  nm.textContent = city.name;
  row.appendChild(nm);

  if (city.active) {
    // Стрелка → кликабельный город
    const arr = document.createElement('span');
    arr.className = 'city-row-arr';
    arr.innerHTML = `<svg width="13" height="13" viewBox="0 0 24 24" fill="none"
      stroke="currentColor" stroke-width="2"><path d="M9 18l6-6-6-6"/></svg>`;
    row.appendChild(arr);

    row.addEventListener('click', () => openCityDetail(city));
  } else {
    const soon = document.createElement('span');
    soon.className = 'city-soon';
    soon.textContent = 'Скоро';
    row.appendChild(soon);
  }

  return row;
}

// ── Показать ошибку ────────────────────────────────────────────
function showError(msg) {
  subEl.textContent = 'Ошибка загрузки';
  bodyEl.innerHTML  = `
    <div class="cov-err">
      <div class="cov-err-ico">
        <svg width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4">
          <circle cx="12" cy="12" r="10"/>
          <line x1="12" y1="8" x2="12" y2="12"/>
          <line x1="12" y1="16" x2="12.01" y2="16"/>
        </svg>
      </div>
      <div class="cov-err-title">Не удалось загрузить</div>
      <div class="cov-err-sub">${msg || 'Проверьте подключение и попробуйте снова'}</div>
    </div>
  `;
}

// ── Основная загрузка ──────────────────────────────────────────
async function loadCoverage() {
  try {
    const snap = await getDocs(
      query(collection(db, 'cities'), orderBy('order'))
    );

    const cities = snap.docs.map(d => ({ id: d.id, ...d.data() }));

    if (!cities.length) {
      subEl.textContent = 'Нет данных';
      bodyEl.innerHTML  = '';
      return;
    }

    const activeCount = cities.filter(c => c.active).length;
    subEl.textContent = `Доставляем в ${activeCount} ${pluralCity(activeCount)}`;

    regionMap = new Map();
    cities.forEach(city => {
      const r = city.region || 'Другие';
      if (!regionMap.has(r)) regionMap.set(r, []);
      regionMap.get(r).push(city);
    });

    renderCities();

  } catch (err) {
    console.error('[coverage] Firestore error:', err);
    showError(err.message);
  }
}

loadCoverage();
</script>
